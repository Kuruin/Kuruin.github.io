<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notes</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #fafafa;
            --hover: rgba(0, 0, 0, .04);
            --active: rgba(0, 0, 0, .065);
            --border: rgba(0, 0, 0, .07);
            --text: #111111;
            --text-2: #6e6e6e;
            --text-3: #a8a8a8;
            --inverse: #ffffff;
            --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .08);
            --glass: rgba(255, 255, 255, .78);

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

            --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
            --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #0b0b0c;
            --surface: #101012;
            --hover: rgba(255, 255, 255, .045);
            --active: rgba(255, 255, 255, .08);
            --border: rgba(255, 255, 255, .075);
            --text: #ededed;
            --text-2: #8d8d8d;
            --text-3: #565656;
            --inverse: #0b0b0c;
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
            --glass: rgba(11, 11, 12, .72);
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: var(--sans);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        button, input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 6px; }

        /* pressables: instant feedback on press */
        .press { transition: transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease; }
        .press:active { transform: scale(0.97); }

        /* ---------- layout ---------- */
        .app {
            display: grid;
            grid-template-columns: 220px 320px 1fr;
            height: 100dvh;
        }

        .pane-nav, .pane-list { background: var(--surface); border-right: 1px solid var(--border); min-height: 0; display: flex; flex-direction: column; }

        /* ---------- nav pane ---------- */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 20px 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand-mark {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: var(--text);
            color: var(--inverse);
            display: grid;
            place-items: center;
            font-family: var(--serif);
            font-size: 16px;
            font-style: italic;
            font-weight: 400;
        }

        .nav { padding: 4px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; }

        .nav-label {
            font-family: var(--mono);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-3);
            padding: 18px 10px 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 8px;
            color: var(--text-2);
            text-align: left;
            width: 100%;
        }

        .nav-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav-item .count { flex: none; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
        .nav-item.active { background: var(--active); color: var(--text); }

        .nav-foot { display: flex; gap: 2px; padding: 12px 10px 16px; border-top: 1px solid var(--border); }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: var(--text-2);
        }

        .icon-btn.on { color: var(--text); }
        .icon-btn.on svg { fill: currentColor; }

        /* ---------- list pane ---------- */
        .list-head { padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
        .list-title-row { display: flex; align-items: center; gap: 8px; }

        .list-title {
            flex: 1;
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list-count { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

        .new-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px 0 10px;
            border-radius: 8px;
            background: var(--text);
            color: var(--inverse);
            font-weight: 500;
            font-size: 13px;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 10px;
            border-radius: 9px;
            background: var(--hover);
            color: var(--text-3);
            transition: background-color 150ms ease, box-shadow 150ms ease;
        }

        .search:focus-within { background: var(--bg); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .04); }
        .search input { flex: 1; min-width: 0; color: var(--text); }
        .search input::placeholder { color: var(--text-3); }
        .search input::-webkit-search-cancel-button { display: none; }

        kbd {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text-3);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1px 5px;
        }

        .filter-row { display: none; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
        .filter-row::-webkit-scrollbar { display: none; }

        .filter-row button {
            flex: none;
            height: 28px;
            padding: 0 11px;
            border-radius: 999px;
            color: var(--text-2);
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .filter-row button.active { background: var(--text); border-color: var(--text); color: var(--inverse); }

        .note-list { list-style: none; overflow-y: auto; flex: 1; padding: 4px 8px 24px; }

        .note-item {
            padding: 12px 12px 13px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .note-item + .note-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12px;
            right: 12px;
            border-top: 1px solid var(--border);
        }

        .note-item.active::before, .note-item.active + .note-item::before { border-color: transparent; }
        .note-item.active { background: var(--active); }

        .note-item .t {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            letter-spacing: -0.005em;
        }

        .note-item .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-item .t svg { width: 12px; height: 12px; fill: currentColor; stroke: none; color: var(--text-2); }
        .note-item .t.untitled span { color: var(--text-3); }

        .note-item .s {
            color: var(--text-2);
            font-size: 13px;
            margin-top: 3px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-item .m { display: flex; gap: 8px; margin-top: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

        .note-list.stagger .note-item {
            animation: rise 320ms var(--ease-out) both;
            animation-delay: calc(var(--i) * 35ms);
        }

        @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

        .list-empty { padding: 48px 20px; text-align: center; color: var(--text-3); font-size: 13px; line-height: 1.6; }

        /* ---------- editor ---------- */
        .editor { position: relative; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

        .toolbar {
            position: absolute;
            inset: 0 0 auto 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 20px;
            background: var(--glass);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            backdrop-filter: saturate(180%) blur(16px);
            mask-image: linear-gradient(to bottom, #000 80%, transparent);
        }

        .back { display: none; }

        .cat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 30px;
            padding: 0 10px 0 8px;
            border-radius: 8px;
            color: var(--text-2);
        }

        .cat svg { width: 14px; height: 14px; color: var(--text-3); }
        .cat input { width: 120px; font-size: 13px; color: var(--text); }
        .cat input::placeholder { color: var(--text-3); }
        .cat:focus-within { background: var(--hover); }

        .spacer { flex: 1; }

        .status {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-3);
            margin-right: 6px;
            transition: opacity 200ms ease;
        }

        .seg {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 3px;
            border-radius: 9px;
            background: var(--hover);
            margin-right: 4px;
        }

        .seg button { position: relative; z-index: 1; height: 24px; padding: 0 12px; font-size: 12.5px; color: var(--text-2); transition: color 150ms ease; }
        .seg button[aria-pressed="true"] { color: var(--text); }

        .seg-ind {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 3px;
            width: calc(50% - 3px);
            border-radius: 6px;
            background: var(--bg);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--border);
            transition: transform 220ms var(--ease-in-out);
        }

        .seg[data-mode="read"] .seg-ind { transform: translateX(100%); }
        .seg.instant .seg-ind, .seg.instant button { transition: none; }

        .page { flex: 1; overflow-y: auto; padding: 96px 32px 120px; }
        .page-inner { max-width: 680px; margin: 0 auto; }

        .title-input {
            width: 100%;
            font-family: var(--serif);
            font-size: 44px;
            line-height: 1.08;
            letter-spacing: -0.015em;
            font-weight: 400;
            resize: none;
            overflow: hidden;
            display: block;
        }

        .title-input::placeholder { color: var(--text-3); }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 14px 0 32px;
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-3);
        }

        .body-input, .preview { font-size: 16px; line-height: 1.75; letter-spacing: -0.003em; }

        .body-input {
            width: 100%;
            min-height: 50vh;
            resize: none;
            display: block;
        }

        .body-input::placeholder { color: var(--text-3); }

        /* rendered markdown */
        .preview { word-wrap: break-word; }
        .preview > * + * { margin-top: .75em; }
        .preview h1, .preview h2, .preview h3 { font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; margin-top: 1.6em; }
        .preview > :first-child { margin-top: 0; }
        .preview h1 { font-size: 24px; }
        .preview h2 { font-size: 19px; }
        .preview h3 { font-size: 16px; }
        .preview strong { font-weight: 600; }

        .preview a {
            color: var(--text);
            text-decoration: underline;
            text-decoration-color: var(--text-3);
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            transition: text-decoration-color 150ms ease;
        }

        .preview ul, .preview ol { padding-left: 1.3em; }
        .preview li { padding-left: .2em; }
        .preview li + li { margin-top: .2em; }
        .preview li::marker { color: var(--text-3); }
        .preview li.task { list-style: none; margin-left: -1.3em; padding-left: 0; }
        .preview li.task label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
        .preview li.task.done label > span { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }

        .check {
            appearance: none;
            flex: none;
            width: 17px;
            height: 17px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1.5px solid var(--text-3);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
        }

        .check:active { transform: scale(0.9); }
        .check::after {
            content: '';
            width: 8px;
            height: 4px;
            border: solid var(--inverse);
            border-width: 0 0 1.75px 1.75px;
            transform: translateY(-1px) rotate(-45deg) scale(0.6);
            opacity: 0;
            transition: opacity 150ms ease, transform 200ms var(--ease-out);
        }

        .check:checked { background: var(--text); border-color: var(--text); }
        .check:checked::after { opacity: 1; transform: translateY(-1px) rotate(-45deg) scale(1); }

        .preview blockquote { padding-left: 16px; border-left: 2px solid var(--text); color: var(--text-2); font-family: var(--serif); font-size: 20px; line-height: 1.5; font-style: italic; }
        .preview code { font-family: var(--mono); font-size: .86em; background: var(--hover); padding: 2px 5px; border-radius: 5px; }
        .preview pre { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
        .preview pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
        .preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
        .preview .placeholder { color: var(--text-3); }

        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            padding: 32px;
        }

        .empty h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -0.01em; }
        .empty p { color: var(--text-2); margin-bottom: 14px; }
        .empty p kbd { margin: 0 2px; }

        /* ---------- toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 10px 10px 16px;
            border-radius: 12px;
            background: var(--text);
            color: var(--inverse);
            box-shadow: var(--shadow);
            font-size: 13px;
            opacity: 0;
            transform: translate(-50%, 12px) scale(0.97);
            transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
        .toast.hide { transition-duration: 160ms; }

        .toast button {
            height: 26px;
            padding: 0 10px;
            border-radius: 7px;
            background: color-mix(in srgb, var(--inverse) 16%, transparent);
            color: var(--inverse);
            font-weight: 500;
            font-size: 12.5px;
        }

        /* ---------- hover (pointer devices only) ---------- */
        @media (hover: hover) and (pointer: fine) {
            .nav-item:hover, .icon-btn:hover, .cat:hover, .back:hover { background: var(--hover); color: var(--text); }
            .note-item:not(.active):hover { background: var(--hover); }
            .note-item:hover::before, .note-item:hover + .note-item::before { border-color: transparent; }
            .new-btn:hover { opacity: .88; }
            .seg button:hover { color: var(--text); }
            .filter-row button:not(.active):hover { background: var(--hover); }
            .preview a:hover { text-decoration-color: var(--text); }
            .check:hover { border-color: var(--text-2); }
        }

        /* ---------- responsive ---------- */
        @media (max-width: 1080px) {
            .app { grid-template-columns: 300px 1fr; }
            .pane-nav { display: none; }
            .filter-row { display: flex; }
            .list-tools { display: flex; }
        }

        .list-tools { display: none; gap: 0; margin-right: -6px; }

        @media (max-width: 720px) {
            .app { grid-template-columns: 1fr; }
            .pane-list { border-right: none; }
            .app.reading .pane-list { display: none; }
            .app:not(.reading) .editor { display: none; }
            .back { display: grid; }
            .toolbar { padding: 10px 12px; }
            .page { padding: 76px 20px 120px; }
            .title-input { font-size: 34px; }
            .cat input { width: 90px; }
            .status { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .note-list.stagger .note-item { animation: none; }
            .seg-ind { transition: none; }
            .toast { transform: translate(-50%, 0); }
            .press:active, .check:active { transform: none; }
        }

        @media (prefers-reduced-transparency: reduce) {
            .toolbar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <div class="app" id="app">
        <aside class="pane-nav">
            <div class="brand"><span class="brand-mark">n</span>Notes</div>
            <nav class="nav" id="nav"></nav>
            <div class="nav-foot">
                <button class="icon-btn press" data-action="export" title="Export notes (data.json)"><svg><use href="#i-down" /></svg></button>
                <button class="icon-btn press" data-action="import" title="Import notes"><svg><use href="#i-up" /></svg></button>
                <span class="spacer"></span>
                <button class="icon-btn press" data-action="theme" title="Toggle theme"><svg><use class="theme-icon" href="#i-moon" /></svg></button>
            </div>
        </aside>

        <section class="pane-list">
            <div class="list-head">
                <div class="list-title-row">
                    <h1 class="list-title" id="listTitle">All notes</h1>
                    <div class="list-tools">
                        <button class="icon-btn press" data-action="export" title="Export notes"><svg><use href="#i-down" /></svg></button>
                        <button class="icon-btn press" data-action="import" title="Import notes"><svg><use href="#i-up" /></svg></button>
                        <button class="icon-btn press" data-action="theme" title="Toggle theme"><svg><use class="theme-icon" href="#i-moon" /></svg></button>
                    </div>
                    <button class="new-btn press" data-action="new" title="New note"><svg><use href="#i-plus" /></svg>New</button>
                </div>
                <label class="search">
                    <svg><use href="#i-search" /></svg>
                    <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
                    <kbd>Ctrl K</kbd>
                </label>
                <div class="filter-row" id="filterRow"></div>
            </div>
            <ul class="note-list" id="list"></ul>
        </section>

        <main class="editor" id="editor"></main>
    </div>

    <datalist id="categories"></datalist>
    <input type="file" id="importFile" accept="application/json,.json" hidden>

    <script>

        const THEME_KEY = 'kuruin-notebook-theme';
        const DEFAULT_CATEGORIES = ['Websites', 'Skills', 'Ideas', 'General'];
        const ALL = 'All notes';
        const STARRED = 'Starred';

        const WELCOME = {

Press Ctrl E to switch between writing and reading, and Ctrl K to search.`
        };

        let data;
        let currentId = null;
        let editing = false;
        let query = '';
        let filter = ALL;
        let saveTimer = null;

        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const uid = () => 'n-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const icon = (name) => `<svg><use href="#i-${name}"/></svg>`;
        const current = () => data.notes.find((n) => n.id === currentId);
        const isNarrow = () => matchMedia('(max-width: 720px)').matches;

        function fmtDate(t, long) {
            const d = new Date(t);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            const opts = { day: 'numeric', month: 'short' };
            if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
            if (long) Object.assign(opts, { hour: 'numeric', minute: '2-digit' });
            return d.toLocaleString([], opts);
        }

        const wordCount = (s) => (s.match(/\S+/g) || []).length;

        // ---------- storage ----------
        function persist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch { }
        }

        function saveSoon() {
            setStatus('Saving');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { persist(); setStatus('Saved'); }, 400);
        }

        async function load() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch { }
            try {
                const res = await fetch('data.json', { cache: 'no-store' });
                if (res.ok) return await res.json();
            } catch { }
            return { notes: [WELCOME] };
        }

        const isValid = (d) => d && Array.isArray(d.notes);

        // ---------- markdown (small subset) ----------
        function inline(s) {
            const kept = [];
            const keep = (html) => `\u0000${kept.push(html) - 1}\u0000`;
            s = escapeHtml(s);
            s = s.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
            s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => keep(`<a href="${u}" target="_blank" rel="noopener">${t}</a>`));
            s = s.replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)'"]/g, (u) => keep(`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, '')}</a>`));
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
            return s.replace(/\u0000(\d+)\u0000/g, (_, i) => kept[i]);
        }

        function renderMarkdown(src) {
            const lines = src.split('\n');
            let html = '';
            let list = null;
            const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
            const openList = (tag) => { if (list !== tag) { closeList(); html += `<${tag}>`; list = tag; } };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let m;
                if (line.startsWith('```')) {
                    closeList();
                    const code = [];
                    while (++i < lines.length && !lines[i].startsWith('```')) code.push(lines[i]);
                    html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;
                } else if ((m = line.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))) {
                    if (!m[2].trim()) continue;
                    openList('ul');
                    const done = m[1] !== ' ';
                    html += `<li class="task${done ? ' done' : ''}"><label><input class="check" type="checkbox" data-line="${i}"${done ? ' checked' : ''}><span>${inline(m[2])}</span></label></li>`;
                } else if ((m = line.match(/^\s*[-*] (.*)$/))) {
                    if (!m[1].trim()) continue;
                    openList('ul');
                    html += `<li>${inline(m[1])}</li>`;
                } else if ((m = line.match(/^\s*\d+\. (.*)$/))) {
                    openList('ol');
                    html += `<li>${inline(m[1])}</li>`;
                } else if ((m = line.match(/^(#{1,3}) (.*)$/))) {
                    closeList();
                    html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
                } else if ((m = line.match(/^> ?(.*)$/))) {
                    closeList();
                    html += `<blockquote>${inline(m[1])}</blockquote>`;
                } else if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
                    closeList();
                    html += '<hr>';
                } else if (line.trim()) {
                    closeList();
                    html += `<p>${inline(line)}</p>`;
                } else {
                    closeList();
                }
            }
            closeList();
            return html || '<p class="placeholder">Nothing here yet. Switch to Write to start.</p>';
        }

        // ---------- sidebar ----------
        function categories() {
            return [...new Set(data.notes.map((n) => n.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        }

        function inFilter(n, f) {
            return f === ALL || (f === STARRED ? n.starred : n.category === f);
        }

        function visibleNotes() {
            const words = query.split(/\s+/).filter(Boolean);
            return data.notes
                .filter((n) => inFilter(n, filter))
                .filter((n) => {
                    const hay = `${n.title} ${n.body} ${n.category}`.toLowerCase();
                    return words.every((w) => hay.includes(w));
                })
                .sort((a, b) => (b.starred - a.starred) || (b.updated - a.updated));
        }

        function setFilter(f) {
            filter = f;
            renderNav();
            renderList(true);
        }

        function renderNav() {
            const cats = categories();
            if (filter !== ALL && filter !== STARRED && !cats.includes(filter)) filter = ALL;

            const count = (f) => data.notes.filter((n) => inFilter(n, f)).length;
            const item = (f, ic) => `<button class="nav-item press${filter === f ? ' active' : ''}" data-filter="${escapeHtml(f)}">${icon(ic)}<span>${escapeHtml(f)}</span><i class="count">${count(f)}</i></button>`;

            $('#nav').innerHTML = item(ALL, 'notes') + item(STARRED, 'star')
                + (cats.length ? `<div class="nav-label">Categories</div>` + cats.map((c) => item(c, 'hash')).join('') : '');

            $('#filterRow').innerHTML = [ALL, STARRED, ...cats]
                .map((f) => `<button class="press${filter === f ? ' active' : ''}" data-filter="${escapeHtml(f)}">${escapeHtml(f === ALL ? 'All' : f)}</button>`).join('');

            $('#listTitle').textContent = filter;
            $('#categories').innerHTML = [...new Set([...DEFAULT_CATEGORIES, ...cats])].map((c) => `<option value="${escapeHtml(c)}">`).join('');
        }

        document.addEventListener('click', (e) => {
            const f = e.target.closest('[data-filter]');
            if (f) setFilter(f.dataset.filter);
        });

        function renderList(animate) {
            const el = $('#list');
            const notes = visibleNotes();
            el.classList.toggle('stagger', !!animate);

            if (!notes.length) {
                el.innerHTML = `<li class="list-empty">${query ? 'No notes match your search.' : data.notes.length ? 'No notes here yet.' : 'Your notebook is empty.<br>Create your first note.'}</li>`;
                return;
            }

            el.innerHTML = notes.map((n, i) => {
                const snippet = n.body.replace(/^#+ |^> ?|\*|`|\[( |x|X)\] /gm, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\s+/g, ' ').trim().slice(0, 140);
                return `<li class="note-item${n.id === currentId ? ' active' : ''}" data-id="${n.id}" style="--i:${Math.min(i, 12)}">
                    <div class="t${n.title ? '' : ' untitled'}">${n.starred ? icon('star') : ''}<span>${escapeHtml(n.title || 'Untitled')}</span></div>
                    ${snippet ? `<div class="s">${escapeHtml(snippet)}</div>` : ''}
                    <div class="m"><span>${fmtDate(n.updated)}</span>${n.category ? `<span>${escapeHtml(n.category)}</span>` : ''}</div>
                </li>`;
            }).join('');
        }

        $('#list').addEventListener('click', (e) => {
            const item = e.target.closest('.note-item');
            if (item) openNote(item.dataset.id);
        });

        // ---------- editor ----------
        function setStatus(t) {
            const s = $('#status');
            if (s) s.textContent = t;
        }

        function openNote(id, startEditing) {
            currentId = id;
            const n = current();
            editing = startEditing ?? !(n && n.body.trim());
            $('#app').classList.toggle('reading', !!n);
            renderEditor();
            renderList();
        }

        function closeNote() {
            currentId = null;
            $('#app').classList.remove('reading');
            renderEditor();
            renderList();
        }

        function renderEditor() {
            const el = $('#editor');
            const n = current();
            if (!n) {
                el.innerHTML = `<div class="empty">
                    <h2>Nothing selected</h2>
                    <p>Pick a note from the list, or start a new one.</p>
                    <button class="new-btn press" data-action="new">${icon('plus')}New note</button>
                </div>`;
                return;
            }

            el.innerHTML = `
                <div class="toolbar">
                    <button class="icon-btn back press" data-action="back" title="All notes">${icon('back')}</button>
                    <label class="cat" title="Category">${icon('hash')}<input id="catInput" list="categories" placeholder="Category" value="${escapeHtml(n.category || '')}" spellcheck="false"></label>
                    <span class="spacer"></span>
                    <span class="status" id="status"></span>
                    <div class="seg" id="seg" data-mode="${editing ? 'write' : 'read'}">
                        <span class="seg-ind"></span>
                        <button class="press" data-mode="write" aria-pressed="${editing}">Write</button>
                        <button class="press" data-mode="read" aria-pressed="${!editing}">Read</button>
                    </div>
                    <button class="icon-btn press${n.starred ? ' on' : ''}" id="starBtn" title="${n.starred ? 'Unstar' : 'Star'}">${icon('star')}</button>
                    <button class="icon-btn press" id="deleteBtn" title="Delete note">${icon('trash')}</button>
                </div>
                <div class="page"><div class="page-inner">
                    <textarea class="title-input" id="titleInput" rows="1" placeholder="Untitled">${escapeHtml(n.title)}</textarea>
                    <div class="meta"><span id="metaEdited">Edited ${fmtDate(n.updated, true)}</span><span id="metaWords">${wordCount(n.body)} words</span></div>
                    <div id="bodyWrap"></div>
                </div></div>`;

            const touch = () => {
                n.updated = Date.now();
                $('#metaEdited').textContent = 'Edited ' + fmtDate(n.updated, true);
                $('#metaWords').textContent = wordCount(n.body) + ' words';
                saveSoon();
                renderList();
            };

            const title = $('#titleInput');
            const growTitle = () => { title.style.height = 'auto'; title.style.height = title.scrollHeight + 'px'; };
            title.addEventListener('input', () => { n.title = title.value.replace(/\n/g, ' '); touch(); growTitle(); });
            title.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); if (editing) $('#bodyInput').focus(); }
            });
            requestAnimationFrame(growTitle);

            $('#catInput').addEventListener('change', (e) => { n.category = e.target.value.trim(); touch(); renderNav(); });
            $('#catInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });

            $('#starBtn').onclick = (e) => {
                n.starred = !n.starred;
                e.currentTarget.classList.toggle('on', n.starred);
                e.currentTarget.title = n.starred ? 'Unstar' : 'Star';
                persist();
                renderNav();
                renderList();
            };

            $('#deleteBtn').onclick = () => {
                const idx = data.notes.indexOf(n);
                data.notes.splice(idx, 1);
                persist();
                closeNote();
                renderNav();
                toast('Note deleted', 'Undo', () => {
                    data.notes.splice(idx, 0, n);
                    persist();
                    renderNav();
                    openNote(n.id, false);
                });
            };

            $('#seg').addEventListener('click', (e) => {
                const b = e.target.closest('[data-mode]');
                if (b && (b.dataset.mode === 'write') !== editing) setMode(!editing, false);
            });

            renderBody();
        }

        function renderBody() {
            const n = current();
            const wrap = $('#bodyWrap');
            const touch = () => {
                n.updated = Date.now();
                $('#metaEdited').textContent = 'Edited ' + fmtDate(n.updated, true);
                $('#metaWords').textContent = wordCount(n.body) + ' words';
                saveSoon();
                renderList();
            };

            if (editing) {
                wrap.innerHTML = `<textarea class="body-input" id="bodyInput" placeholder="Start writing…"></textarea>`;
                const body = $('#bodyInput');
                body.value = n.body;
                const grow = () => { body.style.height = 'auto'; body.style.height = body.scrollHeight + 'px'; };
                body.addEventListener('input', () => { n.body = body.value; grow(); touch(); });
                body.addEventListener('keydown', continueList);
                requestAnimationFrame(grow);
            } else {
                wrap.innerHTML = `<div class="preview" id="preview">${renderMarkdown(n.body)}</div>`;
                const preview = $('#preview');
                preview.addEventListener('change', (e) => {
                    const i = e.target.dataset.line;
                    if (i === undefined) return;
                    const lines = n.body.split('\n');
                    lines[i] = lines[i].replace(/\[( |x|X)\]/, e.target.checked ? '[x]' : '[ ]');
                    n.body = lines.join('\n');
                    touch();
                    e.target.closest('li').classList.toggle('done', e.target.checked);
                });
                preview.addEventListener('dblclick', (e) => { if (!e.target.closest('a, input, label')) setMode(true, false); });
            }
        }

        // Switch write/read without rebuilding the toolbar. Keyboard toggles skip the animation.
        function setMode(write, fromKeyboard) {
            if (!current()) return;
            editing = write;
            const seg = $('#seg');
            seg.classList.toggle('instant', fromKeyboard);
            seg.dataset.mode = write ? 'write' : 'read';
            seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.mode === 'write') === write)));
            renderBody();
            if (write) {
                const body = $('#bodyInput');
                body.focus();
                body.setSelectionRange(body.value.length, body.value.length);
            }
        }

        // Pressing Enter on a list line starts the next item; Enter on an empty item ends the list.
        function continueList(e) {
            if (e.key !== 'Enter' || e.shiftKey) return;
            const ta = e.target;
            const start = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
            const line = ta.value.slice(start, ta.selectionStart);
            const m = line.match(/^(\s*)([-*] \[[ xX]\] |[-*] |(\d+)\. )(.*)$/);
            if (!m) return;
            e.preventDefault();
            if (!m[4].trim()) {
                ta.setRangeText('', start, ta.selectionStart, 'end');
            } else {
                const bullet = m[3] ? `${+m[3] + 1}. ` : m[2].replace(/\[[xX]\]/, '[ ]');
                ta.setRangeText('\n' + m[1] + bullet, ta.selectionStart, ta.selectionEnd, 'end');
            }
            ta.dispatchEvent(new Event('input'));
        }

        function newNote() {
            const isCategory = filter !== ALL && filter !== STARRED;
            const n = { id: uid(), title: '', body: '', category: isCategory ? filter : '', starred: filter === STARRED, created: Date.now(), updated: Date.now() };
            data.notes.push(n);
            persist();
            query = '';
            $('#search').value = '';
            renderNav();
            openNote(n.id, true);
            $('#titleInput').focus();
        }

        // ---------- toast ----------
        let toastTimer;
        function toast(message, actionLabel, onAction) {
            $$('.toast').forEach((t) => t.remove());
            clearTimeout(toastTimer);
            const el = document.createElement('div');
            el.className = 'toast';
            el.setAttribute('role', 'status');
            el.innerHTML = `<span>${escapeHtml(message)}</span>${actionLabel ? `<button class="press">${escapeHtml(actionLabel)}</button>` : ''}`;
            document.body.appendChild(el);
            el.offsetHeight; // commit the start state so the transition runs
            el.classList.add('show');

            const dismiss = () => {
                el.classList.add('hide');
                el.classList.remove('show');
                setTimeout(() => el.remove(), 200);
            };
            if (actionLabel) el.querySelector('button').onclick = () => { onAction(); dismiss(); };

            // pause the timer while the tab is hidden or the pointer rests on the toast
            let remaining = 5000, started = Date.now();
            const run = () => { started = Date.now(); toastTimer = setTimeout(dismiss, remaining); };
            const pause = () => { clearTimeout(toastTimer); remaining -= Date.now() - started; };
            el.addEventListener('pointerenter', pause);
            el.addEventListener('pointerleave', run);
            run();
        }

        // ---------- actions ----------
        const actions = {
            new: newNote,
            back: closeNote,
            theme: () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
            export: () => {
                persist();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(a.href);
                toast(`Exported ${data.notes.length} note${data.notes.length === 1 ? '' : 's'}`);
            },
            import: () => $('#importFile').click()
        };

        document.addEventListener('click', (e) => {
            const b = e.target.closest('[data-action]');
            if (b && actions[b.dataset.action]) actions[b.dataset.action]();
        });

        $('#importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try {
                const d = JSON.parse(await file.text());
                if (!isValid(d)) throw new Error('bad format');
                const previous = data;
                data = d;
                persist();
                closeNote();
                renderNav();
                renderList(true);
                toast(`Imported ${d.notes.length} note${d.notes.length === 1 ? '' : 's'}`, 'Undo', () => {
                    data = previous;
                    persist();
                    renderNav();
                    renderList(true);
                });
            } catch {
                toast('That file isn’t a notes export');
            }
        });

        $('#search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); renderList(); });
        $('#search').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { e.target.value = ''; query = ''; renderList(); e.target.blur(); }
            if (e.key === 'Enter') { const first = visibleNotes()[0]; if (first) openNote(first.id, false); }
        });

        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); if (current()) setMode(!editing, true); }
            if (mod && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (isNarrow() && current()) closeNote();
                $('#search').focus();
                $('#search').select();
            }
        });

        function applyTheme(t) {
            document.documentElement.dataset.theme = t;
            $$('.theme-icon').forEach((u) => u.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon'));
            $('meta[name="theme-color"]').content = t === 'dark' ? '#0b0b0c' : '#ffffff';
            try { localStorage.setItem(THEME_KEY, t); } catch { }
        }

        // ---------- init ----------
        (async () => {
            let theme = null;
            try { theme = localStorage.getItem(THEME_KEY); } catch { }
            applyTheme(theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

            const loaded = await load();
            data = isValid(loaded) ? loaded : { notes: [WELCOME] };
            renderNav();
            const first = visibleNotes()[0];
            if (first && !isNarrow()) {
                currentId = first.id;
                editing = !first.body.trim();
                $('#app').classList.add('reading');
                renderEditor();
            } else {
                renderEditor();
            }
            renderList(true);
        })();
    </script>
</body>

</html>
