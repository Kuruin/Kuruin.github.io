<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notes</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f8f8f8;
            --hover: rgba(0, 0, 0, .04);
            --active: rgba(0, 0, 0, .06);
            --border: rgba(0, 0, 0, .08);
            --border-strong: rgba(0, 0, 0, .14);
            --text: #171717;
            --text-2: #5e5e5e;
            --text-3: #8a8a8a;
            --placeholder: #b0b0b0;
            --inverse: #ffffff;
            --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .1);
            --selection: rgba(0, 0, 0, .1);
            --elevated: #ffffff;

            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-icon: cubic-bezier(0.2, 0, 0, 1);

            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #0c0c0d;
            --sidebar: #121214;
            --hover: rgba(255, 255, 255, .05);
            --active: rgba(255, 255, 255, .08);
            --border: rgba(255, 255, 255, .08);
            --border-strong: rgba(255, 255, 255, .16);
            --text: #ececec;
            --text-2: #a3a3a3;
            --text-3: #7c7c7c;
            --placeholder: #545454;
            --inverse: #0c0c0d;
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .55);
            --selection: rgba(255, 255, 255, .16);
            --elevated: #1b1b1e;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: var(--sans);
            font-size: .875rem;
            line-height: 1.5;
            font-feature-settings: 'cv11';
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        ::selection { background: var(--selection); }

        button, input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        /* focus ring: a transparent outline waits on every control, then tightens in on keyboard focus */
        button, a, input, [tabindex] { outline: 2px solid transparent; outline-offset: 5px; }
        :focus-visible { outline-color: var(--text); outline-offset: 2px; }
        .title-input:focus-visible, .ProseMirror:focus-visible, .search input:focus-visible, .menu-input:focus-visible, #linkInput:focus-visible, .editor:focus-visible { outline-color: transparent; }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

        .skip {
            position: fixed;
            top: 12px;
            inset-inline-start: 12px;
            z-index: 20;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--text);
            color: var(--inverse);
            text-decoration: none;
            transform: translateY(-200%);
        }

        .skip:focus-visible { transform: none; }

        .press { transition-property: scale, background-color, color, opacity, outline-offset, outline-color; transition-duration: 150ms; transition-timing-function: ease-out; }

        /* ---------- layout ---------- */
        .app {
            display: grid;
            grid-template-columns: 208px 296px minmax(0, 1fr);
            height: 100dvh;
        }

        .app.sidebar-hidden { grid-template-columns: minmax(0, 1fr); }
        .app.sidebar-hidden .pane-nav, .app.sidebar-hidden .pane-list { display: none; }

        .pane-nav, .pane-list { min-height: 0; display: flex; flex-direction: column; border-inline-end: 1px solid var(--border); }
        .pane-nav { background: var(--sidebar); }
        .pane-list { background: var(--bg); }

        /* every pane header shares one 52px row so their contents line up */
        .pane-head { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }

        /* ---------- nav pane ---------- */
        .brand { gap: 10px; font-size: .875rem; font-weight: 600; letter-spacing: -0.006em; }

        .brand-mark {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: var(--text);
            color: var(--inverse);
            display: grid;
            place-items: center;
        }

        .brand-mark svg { width: 12px; height: 12px; stroke-width: 2; }

        .nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; overscroll-behavior: contain; flex: 1; }

        .nav-label {
            font-size: .75rem;
            font-weight: 500;
            color: var(--text-3);
            padding: 20px 8px 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px;
            padding: 0 8px;
            border-radius: 7px;
            color: var(--text-2);
            text-align: start;
            width: 100%;
        }

        .nav-item svg { color: var(--text-3); }
        .nav-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav-item .count { flex: none; font-size: .75rem; font-style: normal; color: var(--text-3); font-variant-numeric: tabular-nums; }
        .nav-item[aria-current="true"] { background: var(--active); color: var(--text); font-weight: 500; }
        .nav-item[aria-current="true"] svg { color: var(--text); }

        .nav-foot { display: flex; gap: 2px; padding: 8px 8px 12px; }

        .icon-btn {
            position: relative;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: var(--text-2);
        }

        .icon-btn.on { color: var(--text); }
        .icon-btn.on svg { fill: currentColor; }
        .icon-btn:disabled { color: var(--placeholder); cursor: default; }
        .divider { width: 1px; height: 16px; background: var(--border); margin: 0 6px; flex: none; }

        /* two icons in one button, cross-faded on state change */
        .swap svg { grid-area: 1 / 1; transition-property: opacity, scale, filter; transition-duration: 300ms; transition-timing-function: var(--ease-icon); }
        .swap svg:last-child, .swap.alt svg:first-child { opacity: 0; scale: .25; filter: blur(4px); }
        .swap.alt svg:last-child { opacity: 1; scale: 1; filter: blur(0); }

        /* ---------- list pane ---------- */
        .list-title {
            flex: 1;
            min-width: 0;
            font-size: .9375rem;
            font-weight: 600;
            letter-spacing: -0.011em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list-title .n { margin-inline-start: 6px; font-weight: 400; color: var(--text-3); font-variant-numeric: tabular-nums; }

        .new-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding-inline: 8px 11px;
            border-radius: 7px;
            background: var(--text);
            color: var(--inverse);
            font-weight: 500;
            font-size: .8125rem;
            white-space: nowrap;
        }

        .list-tools { display: none; }

        /* list pane shares one text edge (18px): title, search icon and note titles line up */
        .pane-list .pane-head { padding-inline-start: 18px; }
        .search-wrap { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; }

        .search {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 8px 0 9px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text-3);
            transition-property: border-color, box-shadow;
            transition-duration: 150ms;
        }

        .search:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--hover); color: var(--text); }
        .search:focus-within svg { scale: 1.08; }
        .search input { flex: 1; min-width: 0; color: var(--text); font-size: .8125rem; }
        .search input::placeholder { color: var(--text-3); }
        .search input::-webkit-search-cancel-button { display: none; }

        kbd {
            font-family: var(--sans);
            font-size: .6875rem;
            font-weight: 500;
            color: var(--text-3);
            background: var(--hover);
            border-radius: 4px;
            padding: 1px 5px;
            white-space: nowrap;
        }

        .filter-row { display: none; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -8px; padding: 0 8px; }
        .filter-row::-webkit-scrollbar { display: none; }

        .filter-row button {
            flex: none;
            height: 28px;
            padding: 0 11px;
            border-radius: 999px;
            color: var(--text-2);
            font-size: .8125rem;
            border: 1px solid var(--border);
        }

        .filter-row button[aria-current="true"] { background: var(--text); border-color: var(--text); color: var(--inverse); }

        .note-list { list-style: none; overflow-y: auto; overscroll-behavior: contain; flex: 1; padding: 4px 8px 24px; display: flex; flex-direction: column; gap: 4px; }

        .note-item {
            display: block;
            width: 100%;
            text-align: start;
            padding: 10px 10px 11px;
            border-radius: 8px;
        }

        .note-item[aria-current="true"] { background: var(--active); }

        .note-item .t { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: .875rem; letter-spacing: -0.006em; }
        .note-item .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-item .t svg { width: 12px; height: 12px; fill: currentColor; stroke: none; color: var(--text-2); }
        .note-item .t.untitled span { color: var(--text-3); font-weight: 400; }

        .note-item .s {
            color: var(--text-2);
            font-size: .8125rem;
            margin-top: 2px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .note-item .m { display: flex; gap: 6px; margin-top: 6px; font-size: .75rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
        .note-item .m span + span::before { content: '·'; margin-inline-end: 6px; }

        .list-empty { padding: 40px 16px; text-align: center; color: var(--text-3); font-size: .8125rem; line-height: 1.6; text-wrap: balance; }

        /* ---------- editor ---------- */
        .editor { position: relative; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

        .toolbar {
            height: 52px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 12px;
            min-width: 0;
        }

        /* controls keep their size; only the category chip gives way (and truncates) */
        .toolbar > * { flex: none; }
        .toolbar > .cat { flex: 0 1 auto; min-width: 0; }
        .toolbar > .spacer { flex: 1 1 0; min-width: 4px; }

        .back { display: none; }

        .cat {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            max-width: 14rem;
            padding-inline: 8px 8px;
            margin-inline-start: 6px;
            border-radius: 999px;
            border: 1px dashed var(--border-strong);
            color: var(--text-3);
            font-size: .8125rem;
            transition-property: scale, background-color, border-color, color, outline-offset, outline-color;
        }

        .cat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat.has-value { border-style: solid; border-color: var(--border); color: var(--text); }
        .cat svg { width: 13px; height: 13px; color: var(--text-3); }
        .cat .chev { width: 12px; height: 12px; transition: rotate 200ms var(--ease-out); }
        .cat[aria-expanded="true"] { border-style: solid; border-color: var(--border-strong); background: var(--hover); }
        .cat[aria-expanded="true"] .chev { rotate: 180deg; }

        /* ---------- dropdown menu ---------- */
        .menu {
            position: fixed;
            z-index: 9;
            width: 15rem;
            padding: 4px;
            border-radius: 12px;
            background: var(--elevated);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform-origin: top left;
            opacity: 0;
            visibility: hidden;
            transition-property: opacity, visibility, scale, translate;
            transition-duration: 100ms;
            transition-timing-function: ease-out;
        }

        .menu.show { opacity: 1; visibility: visible; transition-duration: 160ms; }

        .menu-input {
            width: 100%;
            height: 34px;
            padding: 0 10px;
            font-size: .8125rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .menu-input::placeholder { color: var(--text-3); }
        .menu ul { list-style: none; max-height: 15rem; overflow-y: auto; overscroll-behavior: contain; }

        .menu li {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 8px;
            border-radius: 7px;
            color: var(--text-2);
            font-size: .8125rem;
            cursor: pointer;
            user-select: none;
            transition: background-color 80ms ease, color 80ms ease;
        }

        .menu li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .menu li svg { width: 14px; height: 14px; color: var(--text-3); }
        .menu li .tick { opacity: 0; color: var(--text); }
        .menu li[aria-selected="true"] { background: var(--hover); color: var(--text); }
        .menu li.chosen .tick { opacity: 1; }
        .menu li.chosen { color: var(--text); font-weight: 500; }
        .menu li.sep { height: 1px; padding: 0; margin: 4px 4px; background: var(--border); border-radius: 0; pointer-events: none; }
        .menu ul { overflow-x: hidden; }
        .menu li.danger span { color: var(--text-2); }
        .menu .menu-empty { color: var(--text-3); cursor: default; }

        .spacer { flex: 1; }

        .status { font-size: .75rem; color: var(--text-3); margin-inline-end: 8px; white-space: nowrap; }

        .page { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 40px 40px 40vh; cursor: text; }
        .page-inner { max-width: 42rem; margin: 0 auto; cursor: auto; }

        .title-input {
            width: 100%;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.022em;
            resize: none;
            overflow: hidden;
            display: block;
            text-wrap: balance;
        }

        .title-input::placeholder { color: var(--placeholder); }

        .meta { display: flex; gap: 6px; margin: 8px 0 24px; font-size: .8125rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

        /* ---------- note body (rich editor + fallback textarea) ---------- */
        .prose, .body-input { font-size: 1rem; line-height: 1.65; letter-spacing: -0.011em; }

        .body-input { width: 100%; min-height: 40vh; resize: none; display: block; }
        .prose.loading { color: var(--text-3); }
        .prose.loading > * + * { margin-top: .75em; }
        .body-input::placeholder { color: var(--placeholder); }

        .prose .ProseMirror { outline: none; min-height: 40vh; overflow-wrap: break-word; text-wrap: pretty; caret-color: var(--text); }
        .prose .ProseMirror > * + * { margin-top: .75em; }
        .prose p.is-editor-empty:first-child::before { content: attr(data-placeholder); float: left; height: 0; color: var(--placeholder); pointer-events: none; }

        .prose h1, .prose h2, .prose h3 { font-weight: 650; line-height: 1.3; margin-top: 1.75em; text-wrap: balance; }
        .prose .ProseMirror > :first-child { margin-top: 0; }
        .prose h1 { font-size: 1.5rem; letter-spacing: -0.019em; }
        .prose h2 { font-size: 1.25rem; letter-spacing: -0.017em; }
        .prose h3 { font-size: 1.0625rem; letter-spacing: -0.014em; }
        .prose h1 + *, .prose h2 + *, .prose h3 + * { margin-top: .5em; }
        .prose strong { font-weight: 600; }

        .prose a {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: var(--border-strong);
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            transition: text-decoration-color 150ms ease;
            cursor: pointer;
        }

        .prose ul, .prose ol { padding-inline-start: 1.375em; }
        .prose li + li { margin-top: .25em; }
        .prose li > p + * { margin-top: .25em; }
        .prose li::marker { color: var(--text-3); }

        .prose ul[data-type="taskList"] { list-style: none; padding-inline-start: 0; }
        .prose ul[data-type="taskList"] > li { display: flex; gap: 10px; align-items: flex-start; }
        .prose ul[data-type="taskList"] > li > label { flex: none; display: flex; height: 1.65em; align-items: center; user-select: none; }
        .prose ul[data-type="taskList"] > li > div { flex: 1; min-width: 0; }
        .prose ul[data-type="taskList"] > li > div { text-decoration: line-through; text-decoration-color: transparent; transition: color 200ms ease, text-decoration-color 200ms ease; }
        .prose ul[data-type="taskList"] > li[data-checked="true"] > div { color: var(--text-3); text-decoration-color: var(--text-3); }
        .prose ul[data-type="taskList"] > li ul[data-type="taskList"] { margin-top: .25em; }

        .prose input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid var(--text-3);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition-property: background-color, border-color, scale;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
        }

        .prose input[type="checkbox"]::after {
            content: '';
            width: 7px;
            height: 3.5px;
            border: solid var(--inverse);
            border-width: 0 0 1.75px 1.75px;
            transform: translateY(-1px) rotate(-45deg);
            /* the tick draws itself: short stroke first, then the long one */
            clip-path: inset(0 100% 0 0);
            transition: clip-path 100ms ease-out;
        }

        .prose input[type="checkbox"]:checked { background: var(--text); border-color: var(--text); }
        .prose input[type="checkbox"]:checked::after { clip-path: inset(0 0 0 0); transition: clip-path 220ms var(--ease-out) 60ms; }

        .prose blockquote { padding-inline-start: 16px; border-inline-start: 2px solid var(--border-strong); color: var(--text-2); }
        .prose code { font-family: var(--mono); font-size: .875em; background: var(--hover); padding: .15em .35em; border-radius: 4px; letter-spacing: 0; }
        .prose pre { background: var(--sidebar); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; overflow-x: auto; }
        .prose pre code { background: none; padding: 0; font-size: .8125rem; line-height: 1.6; }
        .prose hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            padding: 32px;
        }

        .empty h2 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.014em; }
        .empty p { color: var(--text-2); margin-bottom: 16px; text-wrap: balance; }
        .empty p kbd { margin: 0 2px; }

        /* ---------- toast (live region always present) ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 6px 6px 14px;
            border-radius: 10px;
            background: var(--text);
            color: var(--inverse);
            box-shadow: var(--shadow);
            font-size: .8125rem;
            white-space: nowrap;
            translate: -50% 0;
            opacity: 0;
            visibility: hidden;
            transition-property: opacity, visibility;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
        }

        .toast.show { opacity: 1; visibility: visible; transition-duration: 300ms; }
        .toast span { margin-inline-end: 8px; }
        .toast:not(:has(button)) { padding-inline-end: 14px; }

        .toast button {
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            color: var(--inverse);
            font-weight: 500;
            font-size: .8125rem;
        }

        .toast .toast-action { background: color-mix(in srgb, var(--inverse) 16%, transparent); }
        .toast .toast-close { width: 28px; padding: 0; display: grid; place-items: center; opacity: .7; }
        .toast :focus-visible { outline-color: var(--inverse); }

        /* ---------- selection format bar ---------- */
        .fmt {
            position: fixed;
            z-index: 8;
            display: flex;
            align-items: center;
            gap: 1px;
            padding: 4px;
            border-radius: 10px;
            background: var(--elevated);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transition-property: opacity, visibility;
            transition-duration: 120ms;
            transition-timing-function: ease-out;
        }

        .fmt.show { opacity: 1; visibility: visible; }

        .fmt button {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            color: var(--text-2);
            font-size: .8125rem;
            font-weight: 600;
        }

        .fmt button[aria-pressed="true"] { background: var(--active); color: var(--text); }
        .fmt .divider { height: 18px; margin: 0 3px; }
        .fmt input { width: 15rem; height: 30px; padding: 0 8px; font-size: .8125rem; color: var(--text); }
        .fmt input::placeholder { color: var(--text-3); }

        /* ---------- shortcuts dialog ---------- */
        .keys {
            margin: auto;
            width: min(720px, calc(100vw - 32px));
            max-height: calc(100dvh - 64px);
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--elevated);
            color: var(--text);
            box-shadow: var(--shadow);
            overscroll-behavior: contain;
        }

        .keys::backdrop { background: rgba(0, 0, 0, .3); }
        .keys header { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 4px 24px; }
        .keys h2 { font-size: .9375rem; font-weight: 600; letter-spacing: -0.011em; }

    <script>
        const STORAGE_KEY = 'kuruin-notebook-v1';
        const THEME_KEY = 'kuruin-notebook-theme';
        const SIDEBAR_KEY = 'kuruin-notebook-sidebar';
        const DEFAULT_CATEGORIES = ['Websites', 'Skills', 'Ideas', 'General'];
        const ALL = 'All notes';
        const STARRED = 'Starred';

        const WELCOME = {
            id: 'n-welcome',
            title: 'Welcome to Notes',
            category: 'General',
            starred: true,
            created: Date.now(),
            updated: Date.now(),
            body: `Everything saves on its own as you type. While you write, the rest of the screen steps back. Move the mouse to bring it back.

## Formatting as you type
- Start a line with \`#\` or \`##\` for a heading
- Start with \`-\` for a list, or \`[ ]\` for a checklist
- Wrap words in \`**\` for **bold** or \`*\` for *italic*
- Paste a link and it stays clickable: https://dribbble.com

## Try a checklist
- [ ] Save a website I like
- [x] Open my notes

## Handy to know
- Select any text to bold it, add a link or turn it into a list
- **Ctrl Z** undoes, **Ctrl Shift Z** redoes
- **Ctrl \\\\** hides the sidebar, **Ctrl K** searches
- **Ctrl /** shows every shortcut`
        };

        let data;
        let currentId = null;
        let query = '';
        let filter = ALL;
        let saveTimer = null;
        let editor = null;          // TipTap instance for the open note
        let syncTimer = null;
        let lib = null;             // loaded editor modules, or false when unavailable

        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const app = $('#app');
        const uid = () => 'n-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const current = () => data.notes.find((n) => n.id === currentId);
        const isNarrow = () => matchMedia('(max-width: 720px)').matches;
        const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
        const store = {
            get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch { } }
        };

        function fmtDate(t, long) {
            const d = new Date(t);
            const now = new Date();
            const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            if (d.toDateString() === now.toDateString()) return long ? `today at ${time}` : time;
            const y = new Date(now); y.setDate(now.getDate() - 1);
            if (d.toDateString() === y.toDateString()) return long ? `yesterday at ${time}` : 'Yesterday';
            const opts = { day: 'numeric', month: 'short' };
            if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
            return d.toLocaleDateString([], opts) + (long ? ` at ${time}` : '');
        }

        const wordCount = (s) => (s.match(/[\p{L}\p{N}]+/gu) || []).length;
        const plainText = (md) => md
            .replace(/^\s*[-*] \[( |x|X)\] /gm, '')
            .replace(/^#+ |^> ?|^\s*[-*] |^\s*\d+\. /gm, '')
            .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
            .replace(/<?https?:\/\/(www\.)?([^\s>]+?)\/?>?(?=\s|$)/g, '$2')
            .replace(/[*_`\\]/g, '');
        const snippetOf = (md) => plainText(md).replace(/\s+/g, ' ').trim().slice(0, 140);

        // ---------- storage ----------
        function persist() {
            store.set(STORAGE_KEY, JSON.stringify(data));
        }

        // Quiet autosave: no status flicker while typing, one calm "Saved" after.
        function saveSoon() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { persist(); setStatus('Saved'); }, 500);
        }

        async function load() {
            const saved = store.get(STORAGE_KEY);
            if (saved) { try { return JSON.parse(saved); } catch { } }
            try {
                const res = await fetch('data.json', { cache: 'no-store' });
                if (res.ok) return await res.json();
            } catch { }
            return { notes: [WELCOME] };
        }

        const isValid = (d) => d && Array.isArray(d.notes);

        // ---------- rich editor (TipTap, loaded once; falls back to a plain textarea) ----------
        // Every package must share ONE copy of @tiptap/core and ProseMirror, or input rules
        // (typing "## ", "- [ ] " …) silently attach to the wrong instance. `deps` pins them.
        const EDITOR_VERSION = '2.27.3';
        const PIN = `?deps=@tiptap/core@${EDITOR_VERSION},@tiptap/pm@${EDITOR_VERSION}`;
        const esm = (pkg) => import(`https://esm.sh/${pkg}${PIN}`);
        const loadLib = () => lib !== null ? Promise.resolve(lib) : Promise.race([
            Promise.all([
                esm(`@tiptap/core@${EDITOR_VERSION}`),
                esm(`@tiptap/starter-kit@${EDITOR_VERSION}`),
                esm(`@tiptap/extension-task-list@${EDITOR_VERSION}`),
                esm(`@tiptap/extension-task-item@${EDITOR_VERSION}`),
                esm(`@tiptap/extension-link@${EDITOR_VERSION}`),
                esm(`@tiptap/extension-placeholder@${EDITOR_VERSION}`),
                esm('tiptap-markdown@0.8.10')
            ]).then(([core, starter, taskList, taskItem, link, placeholder, md]) => ({
                Editor: core.Editor,
                extensions: [
                    starter.default.configure({ heading: { levels: [1, 2, 3] } }),
                    taskList.default,
                    taskItem.default.configure({
                        nested: true,
                        a11y: { checkboxLabel: (node, checked) => `${checked ? 'Uncheck' : 'Check'} “${node.textContent || 'item'}”` }
                    }),
                    link.default.configure({ autolink: true, openOnClick: false, linkOnPaste: true }),
                    placeholder.default.configure({ placeholder: 'Start writing…' }),
                    md.Markdown.configure({ html: false, linkify: true, tightLists: true, transformPastedText: true })
                ]
            })),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))
        ]).then((l) => (lib = l), () => (lib = false));

        // A bullet list next to a checklist written with the same "-" marker reads back as ONE list
        // (and grows a phantom empty checkbox on every reload). Bullets get "*", checklists keep "-",
        // which markdown always treats as separate lists. Code blocks are left alone.
        function splitLists(md) {
            let inCode = false;
            return md.split('\n').map((line) => {
                if (/^\s*```/.test(line)) inCode = !inCode;
                if (inCode) return line;
                return line
                    .replace(/^(\s*)[-*+] (?!\[[ xX]\]( |$))/, '$1* ')
                    .replace(/^(\s*)[-*+] (\[[ xX]\]( |$))/, '$1- $2');
            }).join('\n');
        }

        // Keep stored markdown tidy: tight checklists, bare links, unambiguous list markers.
        const cleanMarkdown = (md) => splitLists(md)
            .replace(/<(https?:\/\/[^>\s]+)>/g, '$1')
            .replace(/^(\s*[-*] \[[ xX]\] .*)\n\n(?=\s*[-*] \[[ xX]\] )/gm, '$1\n')
            .replace(/^(\s*[-*] \[[ xX]\] .*)\n\n(?=\s*[-*] \[[ xX]\] )/gm, '$1\n');

        function syncFromEditor(n) {
            clearTimeout(syncTimer);
            syncTimer = null;
            if (!editor || !n) return;
            n.body = cleanMarkdown(editor.storage.markdown.getMarkdown());
            edited(n);
        }

        function flushEditor() {
            if (syncTimer) syncFromEditor(current());
        }

        function destroyEditor() {
            flushEditor();
            hideFmt();
            closeCatMenu(false);
            if (editor) { editor.destroy(); editor = null; }
        }

        // ---------- filters ----------
        function categories() {
            return [...new Set(data.notes.map((n) => n.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        }

        function inFilter(n, f) {
            return f === ALL || (f === STARRED ? n.starred : n.category === f);
        }

        function visibleNotes() {
            const words = query.split(/\s+/).filter(Boolean);
            return data.notes
                .filter((n) => inFilter(n, filter))
                .filter((n) => {
                    const hay = `${n.title} ${plainText(n.body)} ${n.category}`.toLowerCase();
                    return words.every((w) => hay.includes(w));
                })
                .sort((a, b) => (b.starred - a.starred) || (b.updated - a.updated));
        }

        function renderNav() {
            const cats = categories();
            if (filter !== ALL && filter !== STARRED && !cats.includes(filter)) filter = ALL;

            const count = (f) => data.notes.filter((n) => inFilter(n, f)).length;
            const item = (f, ic) => `<button class="nav-item press" data-filter="${escapeHtml(f)}" aria-current="${filter === f}">${icon(ic)}<span>${escapeHtml(f)}</span><i class="count" aria-label="${count(f)} notes">${count(f)}</i></button>`;

            $('#nav').innerHTML = item(ALL, 'notes') + item(STARRED, 'star')
                + (cats.length ? `<div class="nav-label" aria-hidden="true">Categories</div>` + cats.map((c) => item(c, 'hash')).join('') : '');

            $('#filterRow').innerHTML = [ALL, STARRED, ...cats]
                .map((f) => `<button class="press" data-filter="${escapeHtml(f)}" aria-current="${filter === f}">${escapeHtml(f === ALL ? 'All' : f)}</button>`).join('');

        }

        // ---------- list ----------
        function itemHtml(n, i) {
            const snippet = snippetOf(n.body);
            return `<li style="--i:${Math.min(i, 8)}"><button class="note-item" data-id="${n.id}" aria-current="${n.id === currentId}">
                <div class="t${n.title ? '' : ' untitled'}">${n.starred ? `<svg aria-label="Starred"><use href="#i-star"/></svg>` : ''}<span>${escapeHtml(n.title || 'Untitled')}</span></div>
                ${snippet ? `<div class="s">${escapeHtml(snippet)}</div>` : ''}
                <div class="m"><span>${fmtDate(n.updated)}</span>${n.category ? `<span>${escapeHtml(n.category)}</span>` : ''}</div>
            </button></li>`;
        }

        function renderList(intro) {
            const el = $('#list');
            const notes = visibleNotes();
            el.classList.toggle('intro', !!intro);
            // the entrance plays once; later row updates must not replay it
            if (intro) setTimeout(() => el.classList.remove('intro'), 1200);

            $('#listTitle').innerHTML = `${escapeHtml(filter)}<span class="n">${notes.length}</span>`;

            if (!notes.length) {
                el.innerHTML = `<li class="list-empty">${query ? 'No notes match your search.' : data.notes.length ? 'No notes here yet.' : 'Your notebook is empty. Create your first note.'}</li>`;
                return;
            }
            el.innerHTML = notes.map(itemHtml).join('');
        }

        // While typing, patch the open note's row in place instead of re-sorting the list,
        // so nothing in the corner of your eye jumps around.
        function patchListItem(n) {
            const btn = $(`.note-item[data-id="${n.id}"]`);
            if (btn) btn.parentElement.outerHTML = itemHtml(n, 0);
        }

        $('#list').addEventListener('click', (e) => {
            const item = e.target.closest('.note-item');
            if (item && item.dataset.id !== currentId) openNote(item.dataset.id);
            else if (item && isNarrow()) openNote(item.dataset.id);
        });

        $('#list').addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            const items = [...$$('.note-item')];
            const i = items.indexOf(document.activeElement);
            if (i < 0) return;
            e.preventDefault();
            items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
        });

        // ---------- focus mode ----------
        // Only kicks in after ~2s of steady typing; a pause longer than 1.5s starts the count over,
        // so a quick edit or a single word never makes the screen shift.
        const FOCUS_AFTER = 2000;
        const FOCUS_GAP = 1500;
        let streakStart = 0;
        let lastKeyAt = 0;

        function setTyping(on) {
            if (!on) {
                streakStart = 0;
                app.classList.remove('typing');
                return;
            }
            const now = Date.now();
            if (!streakStart || now - lastKeyAt > FOCUS_GAP) streakStart = now;
            lastKeyAt = now;
            if (now - streakStart >= FOCUS_AFTER) app.classList.add('typing');
        }

        let lastPointer = null;
        document.addEventListener('pointermove', (e) => {
            if (!app.classList.contains('typing')) return;
            // ignore the tiny jitter of a resting hand on a trackpad
            if (lastPointer && Math.hypot(e.clientX - lastPointer.x, e.clientY - lastPointer.y) < 6) return;
            if (!lastPointer) { lastPointer = { x: e.clientX, y: e.clientY }; return; }
            lastPointer = null;
            setTyping(false);
        });

        function toggleSidebar(force) {
            const hidden = force ?? !app.classList.contains('sidebar-hidden');
            app.classList.toggle('sidebar-hidden', hidden);
            store.set(SIDEBAR_KEY, hidden ? 'hidden' : 'shown');
            $$('.sidebar-btn').forEach((b) => {
                b.setAttribute('aria-expanded', String(!hidden));
                b.setAttribute('aria-label', hidden ? 'Show sidebar' : 'Hide sidebar');
                b.title = (hidden ? 'Show sidebar' : 'Hide sidebar') + ' (Ctrl \\)';
            });
        }

        // ---------- editor pane ----------
        function setStatus(t) {
            const s = $('#status');
            if (!s) return;
            s.textContent = t;
            s.classList.remove('flash');
            if (t) { void s.offsetWidth; s.classList.add('flash'); }
        }

        function openNote(id) {
            destroyEditor();
            currentId = id;
            app.classList.toggle('reading', !!current());
            renderEditor();
            renderList();
        }

        function closeNote() {
            destroyEditor();
            const id = currentId;
            currentId = null;
            app.classList.remove('reading');
            setTyping(false);
            renderEditor();
            renderList();
            const back = id && $(`.note-item[data-id="${id}"]`);
            if (back) back.focus();
        }

        function renderEditor() {
            const el = $('#editor');
            const n = current();
            if (!n) {
                el.innerHTML = `<div class="empty">
                    <h2>No note open</h2>
                    <p>Pick one from the list, or start fresh.</p>
                    <button class="new-btn press" data-action="new">${icon('plus')}New note</button>
                </div>`;
                return;
            }

            const hidden = app.classList.contains('sidebar-hidden');
            el.innerHTML = `
                <div class="toolbar">
                    <button class="icon-btn back press" data-action="back" aria-label="Back to notes">${icon('back')}</button>
                    <button class="icon-btn sidebar-btn press" data-action="sidebar" aria-expanded="${!hidden}" aria-label="${hidden ? 'Show' : 'Hide'} sidebar" title="${hidden ? 'Show' : 'Hide'} sidebar (Ctrl \\)">${icon('sidebar')}</button>
                    <button class="cat press${n.category ? ' has-value' : ''}" id="catBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Category: ${escapeHtml(n.category || 'none')}">${icon('hash')}<span>${escapeHtml(n.category || 'Add category')}</span><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>
                    <span class="spacer"></span>
                    <span class="status" id="status" aria-hidden="true"></span>
                    <button class="icon-btn press history-btn" id="undoBtn" aria-label="Undo" title="Undo (${MOD} Z)" disabled>${icon('undo')}</button>
                    <button class="icon-btn press history-btn" id="redoBtn" aria-label="Redo" title="Redo (${MOD} Shift Z)" disabled>${icon('redo')}</button>
                    <span class="divider history-btn" aria-hidden="true"></span>
                    <button class="icon-btn press${n.starred ? ' on' : ''}" id="starBtn" aria-pressed="${!!n.starred}" aria-label="Star" title="Star">${icon('star')}</button>
                    <button class="icon-btn press trash-btn" id="deleteBtn" aria-label="Delete note" title="Delete note"><svg class="trash" viewBox="0 0 24 24" aria-hidden="true"><g class="lid"><path d="M4.5 7h15M9.5 7V4.5h5V7" /></g><path d="M10 11v6M14 11v6M6.5 7l.8 12.5h9.4L17.5 7" /></svg></button>
                </div>
                <div class="page" id="page"><article class="page-inner">
                    <h2><textarea class="title-input" id="titleInput" rows="1" placeholder="Untitled" aria-label="Title">${escapeHtml(n.title)}</textarea></h2>
                    <div class="meta"><span id="metaEdited">Edited ${fmtDate(n.updated, true)}</span><span aria-hidden="true">·</span><span id="metaWords">${wordCount(plainText(n.body))} words</span></div>
                    <div id="bodyWrap"></div>
                </article></div>`;

            const title = $('#titleInput');
            const growTitle = () => { title.style.height = 'auto'; title.style.height = title.scrollHeight + 'px'; };
            title.addEventListener('input', () => { n.title = title.value.replace(/\n/g, ' '); edited(n); growTitle(); setTyping(true); });
            title.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || (e.key === 'ArrowDown' && title.selectionStart === title.value.length)) {
                    e.preventDefault();
                    focusBody('start');
                }
            });
            requestAnimationFrame(growTitle);

            $('#catBtn').onclick = (e) => (catMenu.classList.contains('show') ? closeCatMenu() : openCatMenu(e.currentTarget));

            $('#undoBtn').onclick = () => editor && editor.chain().focus().undo().run();
            $('#redoBtn').onclick = () => editor && editor.chain().focus().redo().run();
            $('#page').addEventListener('scroll', () => { if (fmtEl.classList.contains('show')) placeFmt(); }, { passive: true });

            $('#starBtn').onclick = (e) => {
                const b = e.currentTarget;
                n.starred = !n.starred;
                b.classList.toggle('on', n.starred);
                b.classList.remove('pop');
                if (n.starred) { void b.offsetWidth; b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 500); }
                b.setAttribute('aria-pressed', String(n.starred));
                persist();
                renderNav();
                renderList();
            };

            $('#deleteBtn').onclick = () => {
                destroyEditor();
                const idx = data.notes.indexOf(n);
                data.notes.splice(idx, 1);
                persist();
                closeNote();
                renderNav();
                renderList();
                toast('Note deleted', 'Undo', () => {
                    data.notes.splice(idx, 0, n);
                    persist();
                    renderNav();
                    openNote(n.id);
                });
            };

            // clicking the empty space below the text continues writing
            $('#page').addEventListener('mousedown', (e) => {
                if (e.target.id === 'page' || e.target.classList.contains('page-inner')) {
                    e.preventDefault();
                    focusBody('end');
                }
            });

            mountBody(n);
        }

        async function mountBody(n) {
            const wrap = $('#bodyWrap');
            if (lib === null) {
                // first visit: show the text quietly while the editor loads, instead of a blank page
                wrap.innerHTML = `<div class="prose loading" aria-busy="true">${n.body.split('\n').filter((l) => l.trim()).map((l) => `<p>${escapeHtml(plainText(l))}</p>`).join('')}</div>`;
            }
            const l = await loadLib();
            if (currentId !== n.id || !wrap.isConnected) return;

            if (l) {
                wrap.innerHTML = '<div class="prose" id="prose"></div>';
                editor = new l.Editor({
                    element: $('#prose'),
                    extensions: l.extensions,
                    content: splitLists(n.body),
                    editorProps: { attributes: { 'aria-label': 'Note', 'aria-multiline': 'true', role: 'textbox', spellcheck: 'true' } },
                    onUpdate: () => {
                        setTyping(true);
                        clearTimeout(syncTimer);
                        syncTimer = setTimeout(() => syncFromEditor(n), 250);
                    }
                });
                // Ctrl/Cmd-click opens a link; a plain click places the cursor for editing
                $('#prose').addEventListener('click', (e) => {
                    const a = e.target.closest('a');
                    if (a && (e.ctrlKey || e.metaKey)) window.open(a.href, '_blank', 'noopener');
                });
                editor.on('transaction', updateHistory);
                editor.on('selectionUpdate', updateFmt);
                editor.on('focus', updateFmt);
                editor.on('blur', ({ event }) => { if (!event || !$('#fmt').contains(event.relatedTarget)) hideFmt(); });
                updateHistory();
            } else {
                $$('.history-btn').forEach((b) => (b.hidden = true));
                wrap.innerHTML = `<textarea class="body-input" id="bodyInput" placeholder="Start writing…" aria-label="Note"></textarea>`;
                const body = $('#bodyInput');
                body.value = n.body;
                const grow = () => { body.style.height = 'auto'; body.style.height = body.scrollHeight + 'px'; };
                body.addEventListener('input', () => { n.body = body.value; grow(); edited(n); setTyping(true); });
                body.addEventListener('keydown', continueList);
                requestAnimationFrame(grow);
            }
            if (pendingFocus) { focusBody(pendingFocus); pendingFocus = null; }
        }

        let pendingFocus = null;
        function focusBody(where) {
            if (editor) {
                editor.view.dom.focus({ preventScroll: true }); // synchronous, so the next keystroke lands in the body
                return editor.commands.focus(where);
            }
            const body = $('#bodyInput');
            if (!body) { pendingFocus = where; return; }
            body.focus();
            const pos = where === 'start' ? 0 : body.value.length;
            body.setSelectionRange(pos, pos);
        }

        // ---------- undo / redo ----------
        function updateHistory() {
            const u = $('#undoBtn'), r = $('#redoBtn');
            if (!editor || !u) return;
            u.disabled = !editor.can().undo();
            r.disabled = !editor.can().redo();
        }

        // ---------- selection format bar ----------
        const fmtEl = $('#fmt');
        const FORMATS = [
            { id: 'bold', icon: 'bold', label: 'Bold', keys: 'B', run: (c) => c.toggleBold() },
            { id: 'italic', icon: 'italic', label: 'Italic', keys: 'I', run: (c) => c.toggleItalic() },
            { id: 'strike', icon: 'strike', label: 'Strikethrough', keys: 'Shift S', run: (c) => c.toggleStrike() },
            { id: 'code', icon: 'code', label: 'Code', keys: 'E', run: (c) => c.toggleCode() },
            null,
            { id: 'heading', icon: 'heading', label: 'Heading', keys: 'Alt 2', attrs: { level: 2 }, run: (c) => c.toggleHeading({ level: 2 }) },
            { id: 'bulletList', icon: 'list', label: 'Bullet list', keys: 'Shift 8', run: (c) => c.toggleBulletList() },
            { id: 'taskList', icon: 'check', label: 'Checklist', keys: 'Shift 9', run: (c) => c.toggleTaskList() },
            null,
            { id: 'link', icon: 'link', label: 'Link', run: null }
        ];

        function renderFmtButtons() {
            fmtEl.innerHTML = FORMATS.map((f) => f
                ? `<button class="press" data-fmt="${f.id}" aria-label="${f.label}" title="${f.label}${f.keys ? ` (${MOD} ${f.keys})` : ''}" aria-pressed="false">${icon(f.icon)}</button>`
                : '<span class="divider" aria-hidden="true"></span>').join('');
        }

        function hideFmt() {
            fmtEl.classList.remove('show');
            delete fmtEl.dataset.mode;
        }

        function placeFmt() {
            const { from, to } = editor.state.selection;
            const a = editor.view.coordsAtPos(from), b = editor.view.coordsAtPos(to);
            const w = fmtEl.offsetWidth, h = fmtEl.offsetHeight;
            const mid = a.top === b.top ? (a.left + b.right) / 2 : a.left + w / 2;
            // on touch the phone's own copy/paste menu sits above the selection, so go below it
            const below = matchMedia('(pointer: coarse)').matches;
            let top = below ? b.bottom + 12 : a.top - h - 8;
            if (top < 8) top = b.bottom + 8; // no room above: sit below the selection
            if (top + h > innerHeight - 8) top = a.top - h - 8;
            fmtEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, mid - w / 2)) + 'px';
            fmtEl.style.top = top + 'px';
        }

        function updateFmt() {
            if (!editor || fmtEl.dataset.mode === 'link') return;
            const { empty } = editor.state.selection;
            if (empty || !editor.isFocused || editor.state.selection.node) return hideFmt();
            if (!fmtEl.querySelector('[data-fmt]')) renderFmtButtons();
            FORMATS.forEach((f) => {
                if (!f) return;
                fmtEl.querySelector(`[data-fmt="${f.id}"]`).setAttribute('aria-pressed', String(editor.isActive(f.id, f.attrs)));
            });
            fmtEl.classList.add('show');
            placeFmt();
        }

        function showLinkInput() {
            const href = editor.getAttributes('link').href || '';
            fmtEl.dataset.mode = 'link';
            fmtEl.innerHTML = `<input id="linkInput" type="url" placeholder="Paste a link, then press Enter" aria-label="Link address" value="${escapeHtml(href)}" spellcheck="false" autocomplete="off">`
                + (href ? `<button class="press" data-fmt="unlink" aria-label="Remove link" title="Remove link">${icon('x')}</button>` : '');
            placeFmt();
            const input = $('#linkInput');
            input.focus();
            input.select();
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    let url = input.value.trim();
                    if (url && !/^[a-z]+:/i.test(url)) url = 'https://' + url;
                    const chain = editor.chain().focus().extendMarkRange('link');
                    (url ? chain.setLink({ href: url }) : chain.unsetLink()).run();
                    closeLinkInput();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeLinkInput();
                    editor.commands.focus();
                }
            });
            input.addEventListener('blur', (e) => { if (!fmtEl.contains(e.relatedTarget)) { closeLinkInput(); hideFmt(); } });
        }

        function closeLinkInput() {
            delete fmtEl.dataset.mode;
            renderFmtButtons();
            updateFmt();
        }

        // keep the text selection while pressing format buttons
        fmtEl.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
        fmtEl.addEventListener('click', (e) => {
            const b = e.target.closest('[data-fmt]');
            if (!b || !editor) return;
            if (b.dataset.fmt === 'link') return showLinkInput();
            if (b.dataset.fmt === 'unlink') {
                editor.chain().focus().extendMarkRange('link').unsetLink().run();
                return closeLinkInput();
            }
            FORMATS.find((f) => f && f.id === b.dataset.fmt).run(editor.chain().focus()).run();
            updateFmt();
        });

        // Ctrl/Cmd+K inside the editor with text selected makes a link; elsewhere it searches.
        function linkShortcut() {
            if (!editor || !editor.isFocused || editor.state.selection.empty) return false;
            updateFmt();
            showLinkInput();
            return true;
        }

        // ---------- category dropdown (combobox) ----------
        const catMenu = $('#catMenu');
        const catSearch = $('#catSearch');
        let catOptions = [];
        let catActive = 0;

        function buildCatOptions() {
            const n = current();
            const q = catSearch.value.trim();
            const all = [...new Set([...DEFAULT_CATEGORIES, ...categories()])].sort((a, b) => a.localeCompare(b));
            const matches = all.filter((c) => c.toLowerCase().includes(q.toLowerCase()));
            const opts = [];
            if (q && !all.some((c) => c.toLowerCase() === q.toLowerCase())) opts.push({ type: 'create', value: q });
            matches.forEach((c) => opts.push({ type: 'pick', value: c }));
            if (n.category && !q) opts.push({ type: 'sep' }, { type: 'remove' });
            return opts;
        }

        function renderCatMenu(keepActive) {
            const n = current();
            catOptions = buildCatOptions();
            const selectable = catOptions.filter((o) => o.type !== 'sep');
            if (!keepActive) {
                const chosen = selectable.findIndex((o) => o.type === 'pick' && o.value === n.category);
                catActive = catSearch.value.trim() ? 0 : Math.max(0, chosen);
            }
            catActive = Math.min(catActive, selectable.length - 1);

            let i = -1;
            $('#catList').innerHTML = catOptions.map((o) => {
                if (o.type === 'sep') return '<li class="sep" role="separator"></li>';
                i++;
                const sel = i === catActive;
                const label = o.type === 'create' ? `Create “${escapeHtml(o.value)}”` : o.type === 'remove' ? 'Remove category' : escapeHtml(o.value);
                const ic = o.type === 'create' ? 'plus' : o.type === 'remove' ? 'x' : 'hash';
                const chosen = o.type === 'pick' && o.value === n.category;
                return `<li id="cat-opt-${i}" role="option" data-i="${i}" aria-selected="${sel}" class="${chosen ? 'chosen' : ''}${o.type === 'remove' ? ' danger' : ''}">${icon(ic)}<span>${label}</span>${o.type === 'pick' ? `<svg class="tick" aria-hidden="true"><use href="#i-tick"/></svg>` : ''}</li>`;
            }).join('') || '<li class="menu-empty" role="presentation"><span>Type to create a category</span></li>';
            catSearch.setAttribute('aria-activedescendant', selectable.length ? `cat-opt-${catActive}` : '');
            const active = $(`#cat-opt-${catActive}`);
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function openCatMenu(trigger) {
            hideFmt();
            catSearch.value = '';
            renderCatMenu();
            const r = trigger.getBoundingClientRect();
            catMenu.style.left = Math.min(r.left, innerWidth - catMenu.offsetWidth - 8) + 'px';
            catMenu.style.top = r.bottom + 6 + 'px';
            catMenu.classList.add('show');
            trigger.setAttribute('aria-expanded', 'true');
            catSearch.focus();
        }

        function closeCatMenu(refocus = true) {
            if (!catMenu.classList.contains('show')) return;
            catMenu.classList.remove('show');
            const b = $('#catBtn');
            if (b) { b.setAttribute('aria-expanded', 'false'); if (refocus) b.focus(); }
        }

        function chooseCat(i) {
            const o = catOptions.filter((x) => x.type !== 'sep')[i];
            const n = current();
            if (!o || !n) return;
            n.category = o.type === 'remove' ? '' : o.value;
            const b = $('#catBtn');
            b.classList.toggle('has-value', !!n.category);
            b.querySelector('span').textContent = n.category || 'Add category';
            b.setAttribute('aria-label', `Category: ${n.category || 'none'}`);
            edited(n);
            renderNav();
            renderList();
            closeCatMenu();
        }

        catSearch.addEventListener('input', () => renderCatMenu());
        catSearch.addEventListener('keydown', (e) => {
            const count = catOptions.filter((o) => o.type !== 'sep').length;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!count) return;
                catActive = (catActive + (e.key === 'ArrowDown' ? 1 : -1) + count) % count;
                renderCatMenu(true);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                chooseCat(catActive);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeCatMenu();
            } else if (e.key === 'Tab') {
                closeCatMenu(false);
            }
        });

        $('#catList').addEventListener('pointermove', (e) => {
            const li = e.target.closest('[data-i]');
            if (!li || +li.dataset.i === catActive) return;
            $$('#catList [aria-selected="true"]').forEach((x) => x.setAttribute('aria-selected', 'false'));
            li.setAttribute('aria-selected', 'true');
            catActive = +li.dataset.i;
            catSearch.setAttribute('aria-activedescendant', li.id);
        });
        $('#catList').addEventListener('mousedown', (e) => e.preventDefault());
        $('#catList').addEventListener('click', (e) => {
            const li = e.target.closest('[data-i]');
            if (li) chooseCat(+li.dataset.i);
        });

        document.addEventListener('pointerdown', (e) => {
            if (catMenu.classList.contains('show') && !catMenu.contains(e.target) && !e.target.closest('#catBtn')) closeCatMenu(false);
        });
        // popovers are placed against the old layout, so close them on resize / rotation
        window.addEventListener('resize', () => { closeCatMenu(false); hideFmt(); });

        // ---------- sliding hover highlight ----------
        // One soft background glides between rows instead of each row flashing on and off.
        function slidingHover(container, selector) {
            if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
            let hl = null;
            container.addEventListener('pointerover', (e) => {
                const item = e.target.closest(selector);
                if (!item || !container.contains(item)) return;
                if (!hl || !hl.isConnected) {
                    hl = document.createElement(container.tagName === 'UL' ? 'li' : 'div');
                    hl.className = 'hl';
                    hl.setAttribute('aria-hidden', 'true');
                    container.prepend(hl);
                }
                const wasOn = container.classList.contains('hl-on');
                hl.classList.toggle('instant', !wasOn);
                // measure against the container itself (rows may sit inside their own positioned <li>)
                const r = item.getBoundingClientRect(), c = container.getBoundingClientRect();
                hl.style.translate = `${r.left - c.left - container.clientLeft + container.scrollLeft}px ${r.top - c.top - container.clientTop + container.scrollTop}px`;
                hl.style.width = item.offsetWidth + 'px';
                hl.style.height = item.offsetHeight + 'px';
                hl.style.right = 'auto';
                container.classList.add('hl-on');
            });
            container.addEventListener('pointerleave', () => container.classList.remove('hl-on'));
        }

        slidingHover($('#nav'), '.nav-item');
        slidingHover($('#list'), '.note-item');

        // ---------- keyboard shortcuts panel ----------
        const SHORTCUTS = [
            ['Editing', [
                ['Undo', `${MOD} Z`], ['Redo', `${MOD} Shift Z`], ['Cut', `${MOD} X`], ['Copy', `${MOD} C`],
                ['Paste', `${MOD} V`], ['Paste without formatting', `${MOD} Shift V`], ['Select all', `${MOD} A`]
            ]],
            ['Formatting', [
                ['Bold', `${MOD} B`], ['Italic', `${MOD} I`], ['Strikethrough', `${MOD} Shift S`], ['Inline code', `${MOD} E`],
                ['Link (with text selected)', `${MOD} K`], ['Heading 1, 2, 3', `${MOD} Alt 1–3`], ['Bullet list', `${MOD} Shift 8`],
                ['Numbered list', `${MOD} Shift 7`], ['Checklist', `${MOD} Shift 9`], ['Indent / outdent list item', 'Tab | Shift Tab']
            ]],
            ['Notes', [
                ['New note', `${MOD} Alt N`], ['Search', `${MOD} K`], ['Save now', `${MOD} S`], ['Hide sidebar', `${MOD} \\`],
                ['Show controls while writing', 'Esc'], ['This panel', `${MOD} /`]
            ]]
        ];

        const keyGroup = ([group, rows]) => `<div class="group"><h3>${group}</h3><dl>${rows.map(([what, keys]) =>
            `<dt>${what}</dt><dd>${keys.split(' ').map((k) => (k === '|' ? '<span>or</span>' : `<kbd>${escapeHtml(k)}</kbd>`)).join('')}</dd>`).join('')}</dl></div>`;
        // two columns: editing and notes on the left, formatting on the right
        $('#keysBody').innerHTML = `<div class="col">${keyGroup(SHORTCUTS[0])}${keyGroup(SHORTCUTS[2])}</div><div class="col">${keyGroup(SHORTCUTS[1])}</div>`;

        function toggleKeys() {
            const d = $('#keys');
            if (d.open) d.close();
            else { setTyping(false); d.showModal(); }
        }

        $('#keys').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

        function edited(n) {
            n.updated = Date.now();
            const ed = $('#metaEdited');
            if (ed && currentId === n.id) {
                ed.textContent = 'Edited ' + fmtDate(n.updated, true);
                $('#metaWords').textContent = wordCount(plainText(n.body)) + ' words';
            }
            setStatus('');
            saveSoon();
            patchListItem(n);
            dismissToast();
        }

        // Fallback editor: Enter on a list line starts the next item; Enter on an empty item ends the list.
        function continueList(e) {
            if (e.key !== 'Enter' || e.shiftKey) return;
            const ta = e.target;
            const start = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
            const line = ta.value.slice(start, ta.selectionStart);
            const m = line.match(/^(\s*)([-*] \[[ xX]\] |[-*] |(\d+)\. )(.*)$/);
            if (!m) return;
            e.preventDefault();
            if (!m[4].trim()) {
                ta.setRangeText('', start, ta.selectionStart, 'end');
            } else {
                const bullet = m[3] ? `${+m[3] + 1}. ` : m[2].replace(/\[[xX]\]/, '[ ]');
                ta.setRangeText('\n' + m[1] + bullet, ta.selectionStart, ta.selectionEnd, 'end');
            }
            ta.dispatchEvent(new Event('input'));
        }

        function newNote() {
            const isCategory = filter !== ALL && filter !== STARRED;
            const n = { id: uid(), title: '', body: '', category: isCategory ? filter : '', starred: filter === STARRED, created: Date.now(), updated: Date.now() };
            data.notes.push(n);
            persist();
            query = '';
            $('#search').value = '';
            renderNav();
            openNote(n.id);
            const row = $(`.note-item[data-id="${n.id}"]`);
            if (row) row.parentElement.classList.add('new');
            $('#titleInput').focus();
        }

        // ---------- toast (Sonner) ----------
        // Sonner is a React component, so it gets React from the same CDN, pinned to one copy.
        // A toast with an action waits until it is used or dismissed; plain messages leave on their own.
        let sonner = null;
        const SONNER_PIN = '?deps=react@18.3.1,react-dom@18.3.1';

        async function loadSonner() {
            try {
                const [React, ReactDOM, s] = await Promise.all([
                    import(`https://esm.sh/react@18.3.1${SONNER_PIN}`),
                    import(`https://esm.sh/react-dom@18.3.1/client${SONNER_PIN}`),
                    import(`https://esm.sh/sonner@1.7.4${SONNER_PIN}`)
                ]);
                const host = document.createElement('div');
                document.body.appendChild(host);
                const root = ReactDOM.createRoot(host);
                const render = () => root.render(React.createElement(s.Toaster, {
                    position: 'bottom-center',
                    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
                    gap: 8,
                    offset: 24,
                    toastOptions: {
                        style: {
                            fontFamily: 'var(--sans)',
                            fontSize: '13px',
                            borderRadius: '12px',
                            padding: '12px 14px',
                            background: 'var(--elevated)',
                            color: 'var(--text)',
                            border: '1px solid var(--border)',
                            boxShadow: 'var(--shadow)'
                        },
                        actionButtonStyle: { background: 'var(--text)', color: 'var(--inverse)', borderRadius: '7px', fontWeight: 500, height: '26px', padding: '0 10px' }
                    }
                }));
                render();
                sonner = { toast: s.toast, render };
            } catch {
                sonner = false;
            }
        }

        function toast(message, actionLabel, onAction) {
            if (sonner) {
                sonner.toast(message, actionLabel
                    ? { duration: Infinity, closeButton: true, action: { label: actionLabel, onClick: onAction } }
                    : { duration: 4000 });
                return;
            }
            fallbackToast(message, actionLabel, onAction);
        }

        function dismissToast() {
            if (sonner) return sonner.toast.dismiss();
            fallbackDismiss();
        }

        // Fallback when Sonner can't load (offline, CDN down).
        let toastTimer;
        const toastEl = $('#toast');

        function fallbackToast(message, actionLabel, onAction) {
            clearTimeout(toastTimer);
            toastEl.innerHTML = `<span>${escapeHtml(message)}</span>`
                + (actionLabel ? `<button class="toast-action press">${escapeHtml(actionLabel)}</button><button class="toast-close press" aria-label="Dismiss">${icon('x')}</button>` : '');
            toastEl.classList.add('show');
            if (actionLabel) {
                toastEl.querySelector('.toast-action').onclick = () => { fallbackDismiss(); onAction(); };
                toastEl.querySelector('.toast-close').onclick = fallbackDismiss;
            } else {
                toastTimer = setTimeout(fallbackDismiss, 4000);
            }
        }

        function fallbackDismiss() {
            if (!toastEl.classList.contains('show')) return;
            clearTimeout(toastTimer);
            toastEl.classList.remove('show');
            setTimeout(() => { if (!toastEl.classList.contains('show')) toastEl.textContent = ''; }, 200);
        }

        // ---------- actions ----------
        const actions = {
            new: newNote,
            back: closeNote,
            sidebar: () => toggleSidebar(),
            keys: toggleKeys,
            'keys-close': () => $('#keys').close(),
            theme: () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
            export: () => {
                flushEditor();
                persist();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(a.href);
                toast(`Exported ${data.notes.length} note${data.notes.length === 1 ? '' : 's'}`);
            },
            import: () => $('#importFile').click()
        };

        document.addEventListener('click', (e) => {
            const f = e.target.closest('[data-filter]');
            if (f) {
                filter = f.dataset.filter;
                renderNav();
                renderList();
                return;
            }
            const b = e.target.closest('[data-action]');
            if (b && actions[b.dataset.action]) actions[b.dataset.action]();
        });

        $('#importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try {
                const d = JSON.parse(await file.text());
                if (!isValid(d)) throw new Error('bad format');
                destroyEditor();
                const previous = data;
                data = d;
                persist();
                closeNote();
                renderNav();
                renderList();
                toast(`Imported ${d.notes.length} note${d.notes.length === 1 ? '' : 's'}`, 'Undo', () => {
                    data = previous;
                    persist();
                    renderNav();
                    renderList();
                });
            } catch {
                toast('That file isn’t a notes export. Choose a data.json you exported here.');
            }
        });

        $('#search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); renderList(); });
        $('#search').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { e.target.value = ''; query = ''; renderList(); e.target.blur(); }
            if (e.key === 'Enter') { const first = visibleNotes()[0]; if (first) openNote(first.id); }
            if (e.key === 'ArrowDown') { const first = $('.note-item'); if (first) { e.preventDefault(); first.focus(); } }
        });

        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;
            const key = e.key.toLowerCase();
            if (mod && key === 'k') {
                e.preventDefault();
                if (linkShortcut()) return;
                if (isNarrow() && current()) closeNote();
                if (app.classList.contains('sidebar-hidden')) toggleSidebar(false);
                setTyping(false);
                $('#search').focus();
                $('#search').select();
            }
            else if (mod && e.key === '\\') { e.preventDefault(); toggleSidebar(); }
            else if (mod && e.key === '/') { e.preventDefault(); toggleKeys(); }
            else if (mod && key === 's') {
                e.preventDefault();
                flushEditor();
                clearTimeout(saveTimer);
                persist();
                setStatus('Saved');
                if (!current()) toast('Saved');
            }
            else if (mod && e.altKey && e.code === 'KeyN') { e.preventDefault(); newNote(); }
            else if (e.key === 'Escape' && app.classList.contains('typing')) setTyping(false);
        });

        window.addEventListener('pagehide', flushEditor);
        document.addEventListener('visibilitychange', () => { if (document.hidden) { flushEditor(); persist(); } });

        // Swap colors without every transition firing at once.
        function applyTheme(t) {
            const freeze = document.createElement('style');
            freeze.textContent = '*,*::before,*::after{transition:none!important}';
            document.head.appendChild(freeze);

            document.documentElement.dataset.theme = t;
            $$('.theme-btn').forEach((b) => b.setAttribute('aria-label', t === 'dark' ? 'Light theme' : 'Dark theme'));
            $('meta[name="theme-color"]').content = t === 'dark' ? '#0c0c0d' : '#ffffff';
            store.set(THEME_KEY, t);
            if (sonner) sonner.render(); // Sonner doesn't follow the page theme on its own

            void document.body.offsetHeight;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                freeze.remove();
                // the icon swap is the one change that should animate
                $$('.theme-btn').forEach((b) => b.classList.toggle('alt', t === 'dark'));
            }));
        }

        // ---------- init ----------
        (async () => {
            const theme = store.get(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(theme);
            if (store.get(SIDEBAR_KEY) === 'hidden') toggleSidebar(true);
            $('.search kbd').textContent = `${MOD} K`;
            loadLib();
            loadSonner();

            const loaded = await load();
            data = isValid(loaded) ? loaded : { notes: [WELCOME] };
            renderNav();
            const first = visibleNotes()[0];
            if (first && !isNarrow()) {
                currentId = first.id;
                app.classList.add('reading');
            }
            renderEditor();
            renderList(true);
        })();
    </script>
</body>

</html>
