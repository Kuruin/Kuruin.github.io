        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const uid = () => 'l-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const store = {
            get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch { } }
        };
        const readJSON = (k, fallback) => { try { return JSON.parse(store.get(k)) ?? fallback; } catch { return fallback; } };
        const lib = $('#lib');
        const isNarrow = () => matchMedia('(max-width: 900px)').matches;
        const isPhone = () => matchMedia('(max-width: 640px)').matches;
        const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
        const MOD = IS_MAC ? '⌘' : 'Ctrl';
        const pluralRules = new Intl.PluralRules('en');
        const plural = (n, word) => `${n} ${pluralRules.select(n) === 'one' ? word : word + 's'}`;
        const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
        const EASE_MOVE = 'cubic-bezier(0.77, 0, 0.175, 1)';

        let db = { items: [] };
        let filter = ALL;
        let query = '';
        let tagFilter = '';
        let sort = SORTS.some((s) => s.id === store.get(SORT_KEY)) ? store.get(SORT_KEY) : 'newest';
        let view = store.get(VIEW_KEY) === 'list' ? 'list' : 'grid';
        let editingId = null;
        let persistTimer = null;
        let collapsed = new Set(readJSON(COLLAPSE_KEY, []));
        let backup = readJSON(BACKUP_KEY, { at: 0, changed: [] });
        if (!Array.isArray(backup.changed)) backup.changed = [];

        // ---------- links ----------
        function normalizeUrl(s) {
            s = String(s || '').trim().replace(/[)\].,;]+$/, '');
            if (!s) return '';
            if (!/^[a-z][\w+.-]*:/i.test(s)) s = 'https://' + s;
            try {
                const u = new URL(s);
                return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : '';
            } catch { return ''; }
        }

        // Same page, however it was typed: no protocol, no www, no trailing slash, no #hash.
        function urlKey(url) {
            try {
                const u = new URL(url);
                return (u.hostname.replace(/^www\./, '') + u.pathname.replace(/\/$/, '') + u.search).toLowerCase();
            } catch { return String(url); }
        }

        // Every link-looking token in a block of text (one per line, comma or space separated).
        const extractUrls = (text) => String(text || '').split(/[\s,]+/).filter((t) => /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(t)).map(normalizeUrl).filter(Boolean);

        const domainOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };

        // A readable starting title from the address:
        // fonts.google.com → "Google Fonts", ui.shadcn.com → "Shadcn", klim.co.nz → "Klim",
        // medium.com/@a/how-to-build-bento-grids-3f2a91 → "How to build bento grids · Medium".
        const HOSTING = /\.(github\.io|vercel\.app|netlify\.app|pages\.dev|webflow\.io|framer\.(website|ai)|notion\.site|super\.site)$/;
        const QUIET_SUBDOMAINS = new Set(['www', 'app', 'ui', 'docs', 'm', 'en', 'beta', 'v2']);
        const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

        function siteName(host) {
            const labels = host.split('.');
            if (HOSTING.test(host)) return cap(labels[0]);
            const twoPart = labels.length > 2 && /^(co|com|org|net|ac|gov)$/.test(labels[labels.length - 2]);
            const nameAt = Math.max(0, labels.length - (twoPart ? 3 : 2));
            const sub = labels.slice(0, nameAt).filter((l) => !QUIET_SUBDOMAINS.has(l));
            return [cap(labels[nameAt]), ...sub.map(cap)].join(' ');
        }

        function titleFromUrl(url) {
            try {
                const u = new URL(url);
                const host = u.hostname.replace(/^www\./, '');
                const parts = u.pathname.split('/').filter(Boolean);
                if (/^(github|gitlab)\.com$/.test(host) && parts.length) return parts.slice(0, 2).join('/');
                // a readable slug (two or more words) says more than the site name
                const slug = decodeURIComponent(parts[parts.length - 1] || '')
                    .replace(/\.[a-z0-9]{2,5}$/i, '')                 // .html, .php…
                    .replace(/[-_](?=[a-z0-9]*\d)[a-z0-9]{5,}$/i, '') // trailing ids like -3f2a91
                    .split(/[-_]+/).filter(Boolean);
                if (slug.length >= 2 && slug.some((w) => /[a-z]{3,}/i.test(w))) return `${cap(slug.join(' ').toLowerCase())} · ${siteName(host)}`;
                return siteName(host);
            } catch { return String(url); }
        }

        // A page title from the bookmarklet, minus the site's own branding:
        // "How to Build Bento Grids | by Someone | Medium" → "How to Build Bento Grids",
        // "GitHub - emilkowalski/skills" → "emilkowalski/skills".
        function cleanPageTitle(title, url) {
            const site = siteName(domainOf(url)).toLowerCase().split(' ')[0];
            const parts = String(title).replace(/\s+/g, ' ').trim().split(/\s+[|–—·•-]\s+/);
            const isBrand = (p) => p.toLowerCase().includes(site) || /^by\s/i.test(p);
            while (parts.length > 1 && isBrand(parts[parts.length - 1])) parts.pop();
            // "GitHub - user/repo: …" leads with the site; a homepage like "Fontshare - Free fonts" keeps its name
            if (parts.length > 1 && parts[0].toLowerCase() === site && /^[\w.-]+\/[\w.-]+/.test(parts[1])) parts.shift();
            return parts.join(' · ').slice(0, 200);
        }

        // First letter for the fallback tile: emoji-safe, skipping leading quotes and punctuation.
        const firstLetter = (s) => {
            const text = String(s || '').trim();
            const parts = typeof Intl.Segmenter === 'function' ? [...new Intl.Segmenter().segment(text)].map((x) => x.segment) : [...text];
            const hit = parts.find((g) => /[\p{L}\p{N}\p{Extended_Pictographic}]/u.test(g));
            return (hit || '?').toUpperCase();
        };

        // Site icon via Google's favicon service; if it fails, a document-level handler swaps in the letter.
        const tile = (item) => `<span class="tile" aria-hidden="true"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domainOf(item.url))}&sz=64" alt="" loading="lazy" referrerpolicy="no-referrer" data-letter="${esc(firstLetter(item.title || domainOf(item.url)))}"></span>`;
        document.addEventListener('error', (e) => {
            const img = e.target;
            if (!(img instanceof HTMLImageElement) || !img.closest('.tile')) return;
            const s = document.createElement('span');
            s.className = 'letter';
            s.textContent = img.dataset.letter || '?';
            img.replaceWith(s);
        }, true);

        // ---------- storage ----------
        // Anything read from storage or an import is cleaned to the expected shape first.
        const str = (v) => (typeof v === 'string' ? v.trim() : '');
        // keep tags to 48 characters, ending at a word break when there is one
        const clipTag = (t) => (t.length <= 48 ? t : (t.slice(0, 48).match(/^(.{12,}?)[-_\s][^-_\s]*$/) || [, t.slice(0, 48)])[1]);
        const cleanTags = (v) => (Array.isArray(v) ? [...new Set(v.filter((t) => typeof t === 'string').map((t) => clipTag(t.trim().replace(/^#/, '').toLowerCase())).filter(Boolean))] : []);

        function cleanItems(list, keys = new Set()) {
            return (Array.isArray(list) ? list : []).flatMap((i) => {
                if (!i || typeof i !== 'object') return [];
                const url = normalizeUrl(str(i.url));
                if (!url || keys.has(urlKey(url))) return [];
                keys.add(urlKey(url));
                let section = str(i.section).slice(0, 40);
                if (RESERVED.some((r) => r.toLowerCase() === section.toLowerCase())) section = '';
                return [{
                    id: str(i.id) || uid(),
                    url,
                    title: str(i.title).slice(0, 200) || titleFromUrl(url),
                    section: SECTIONS.find((s) => s.toLowerCase() === section.toLowerCase()) || section,
                    tags: cleanTags(i.tags),
                    note: str(i.note).slice(0, 2000),
                    starred: i.starred === true,
                    added: Number.isFinite(i.added) ? i.added : Date.now(),
                    updated: Number.isFinite(i.updated) ? i.updated : Date.now()
                }];
            });
        }

        // The browser keeps a copy for instant loading; Neon holds the real list (see "cloud" below).
        function persist(now) {
            clearTimeout(persistTimer);
            const write = () => { store.set(KEY, JSON.stringify(db)); syncSoon(); };
            if (now) write(); else persistTimer = setTimeout(write, 300);
        }

        // Track which links changed since the last backup, so the footer can say "Back up · 12 changes".
        function markChanged(id) {
            if (!backup.changed.includes(id)) backup.changed.push(id);
            store.set(BACKUP_KEY, JSON.stringify(backup));
            renderBackup();
            const n = backup.changed.length;
            if (n > 0 && n % 25 === 0) toast(`${plural(n, 'change')} since your last backup`, { action: { label: 'Back up', onClick: actions.export } });
        }

        async function load() {
            const saved = readJSON(KEY, null);
            if (saved && Array.isArray(saved.items)) return { items: cleanItems(saved.items) };
            return { items: [] };
        }

        // ---------- cloud (Neon) ----------
        // Everyone reads the links table through Neon's Data API. Writes need the owner's Neon Auth sign-in;
        // the database itself refuses anyone else (row-level security), so these addresses are safe to publish.
        const NEON = {
            auth: 'https://ep-polished-breeze-b54oxqeh.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth',
            data: 'https://ep-polished-breeze-b54oxqeh.apirest.c-7.us-east-2.aws.neon.tech/neondb/rest/v1'
        };
        const EDITOR_HINT_KEY = 'kuruin-library-editor'; // only picks the first paint; never grants anything
        const cloud = { client: null, ready: false, editor: false, email: '', synced: new Map(), busy: false, again: false, warned: false };
        let syncTimer = null;

        const toRow = (i) => ({ id: i.id, url: i.url, title: i.title, section: i.section, tags: i.tags, note: i.note, starred: i.starred, added: new Date(i.added).toISOString(), updated: new Date(i.updated).toISOString() });
        const fromRow = (r) => ({ ...r, added: Date.parse(r.added), updated: Date.parse(r.updated) });
        const snapshot = (i) => JSON.stringify(toRow(i));

        function setEditor(editor, email = '') {
            cloud.editor = editor;
            cloud.email = email;
            store.set(EDITOR_HINT_KEY, editor ? '1' : '');
            lib.classList.toggle('readonly', !editor);
            const b = $('#accountBtn');
            const label = editor ? `Signed in as ${email}` : email ? `Signed in as ${email} · this account can’t edit` : 'Sign in to edit';
            b.setAttribute('aria-label', label);
            b.title = label;
            b.classList.toggle('on', !!email);
        }

        async function connectCloud() {
            const { createClient } = await import('https://esm.sh/@neondatabase/neon-js@0.9.0-beta');
            cloud.client = createClient({ auth: { url: NEON.auth, allowAnonymous: true }, dataApi: { url: NEON.data } });
            await checkAccount();
            await pull();
            cloud.ready = true;
        }

        async function checkAccount() {
            const { data } = await cloud.client.auth.getSession();
            const email = data?.user?.email || '';
            let owner = false;
            if (email) {
                const r = await cloud.client.rpc('is_library_owner');
                owner = r.data === true;
            }
            setEditor(owner, email);
        }

        // Replace the local copy with what's in Neon.
        async function pull() {
            const { data, error } = await cloud.client.from('links').select('*').limit(10000);
            if (error) throw error;
            db = { items: cleanItems(data.map(fromRow)) };
            cloud.synced = new Map(db.items.map((i) => [i.id, snapshot(i)]));
            store.set(KEY, JSON.stringify(db));
        }

        function syncSoon() {
            clearTimeout(syncTimer);
            if (cloud.editor) syncTimer = setTimeout(sync, 500);
        }

        // Send only what changed since the last save: new or edited links, then removed ones.
        async function sync() {
            if (!cloud.editor) return;
            if (cloud.busy) { cloud.again = true; return; }
            cloud.busy = true;
            const now = new Map(db.items.map((i) => [i.id, snapshot(i)]));
            const changed = db.items.filter((i) => now.get(i.id) !== cloud.synced.get(i.id));
            const removed = [...cloud.synced.keys()].filter((id) => !now.has(id));
            try {
                // deletes first, so a link removed and pasted again doesn't clash with its old row
                if (removed.length) { const r = await cloud.client.from('links').delete().in('id', removed); if (r.error) throw r.error; }
                if (changed.length) { const r = await cloud.client.from('links').upsert(changed.map(toRow)); if (r.error) throw r.error; }
                removed.forEach((id) => cloud.synced.delete(id));
                changed.forEach((i) => cloud.synced.set(i.id, now.get(i.id)));
                cloud.warned = false;
            } catch (err) {
                // kept in this browser; the next change or reconnect tries again
                if (!cloud.warned) toast(navigator.onLine ? 'Couldn’t save to the cloud. Your changes are kept here and will retry.' : 'You’re offline. Changes are kept here and save when you reconnect.');
                cloud.warned = true;
                if (/jwt|auth|401|403/i.test(String(err?.message || err?.code))) checkAccount().catch(() => { });
            } finally {
                cloud.busy = false;
                if (cloud.again) { cloud.again = false; syncSoon(); }
            }
        }
        window.addEventListener('online', syncSoon);

        // Every change goes through here first.
        function canEdit() {
            if (cloud.editor) return true;
            if (!cloud.ready) toast('Still connecting. Try again in a moment.');
            else toast(cloud.email ? 'This account can’t edit the Library' : 'Sign in to edit the Library', cloud.email ? {} : { action: { label: 'Sign in', onClick: openSignIn } });
            return false;
        }

        // ---------- sign in ----------
        const signin = $('#signin');
        let creating = false;

        function setSignInMode(create) {
            creating = create;
            $('#signinTitle').textContent = create ? 'Create your account' : 'Sign in to edit';
            $('#siSubmit').textContent = create ? 'Create account' : 'Sign in';
            $('#siMode').textContent = create ? 'I have an account' : 'Create account';
            $('#siPass').autocomplete = create ? 'new-password' : 'current-password';
            $('#siError').textContent = '';
        }

        function openSignIn() {
            if (!cloud.client) { toast('Still connecting. Try again in a moment.'); return; }
            setSignInMode(false);
            signin.showModal();
            $('#siEmail').focus();
        }

        $('#siMode').addEventListener('click', () => setSignInMode(!creating));
        $('#signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = $('#siEmail').value.trim();
            const password = $('#siPass').value;
            const err = $('#siError');
            if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter your email address.'; $('#siEmail').focus(); return; }
            if (password.length < 8) { err.textContent = 'Passwords are at least 8 characters.'; $('#siPass').focus(); return; }
            err.textContent = '';
            const btn = $('#siSubmit');
            btn.disabled = true;
            try {
                const r = creating
                    ? await cloud.client.auth.signUp.email({ email, password, name: email.split('@')[0] })
                    : await cloud.client.auth.signIn.email({ email, password });
                if (r?.error) { err.textContent = r.error.message || 'That didn’t work. Check your email and password.'; return; }
                await checkAccount();
                signin.close();
                $('#siPass').value = '';
                if (cloud.editor) { await pull(); render(); toast('Signed in. Changes now save to the cloud.'); }
                else toast(creating ? 'Account created. It can edit once it’s set as the Library’s owner.' : 'Signed in, but this account can’t edit the Library');
            } catch (ex) {
                err.textContent = navigator.onLine ? 'Couldn’t reach the sign-in service. Try again.' : 'You’re offline.';
            } finally { btn.disabled = false; }
        });

        async function signOut() {
            await sync();
            await cloud.client.auth.signOut();
            setEditor(false);
            render();
            toast('Signed out');
        }

        // ---------- queries ----------
        const customSections = () => [...new Set(db.items.map((i) => i.section).filter((s) => s && !SECTIONS.includes(s)))].sort((a, b) => a.localeCompare(b));
        const isSection = (f) => f !== ALL && f !== STARRED && f !== INBOX;
        const destination = () => (isSection(filter) ? filter : INBOX);

        function inFilter(item, f) {
            if (f === ALL) return true;
            if (f === STARRED) return item.starred;
            if (f === INBOX) return !item.section;
            return item.section === f;
        }

        function matchesQuery(item) {
            if (!query) return true;
            const hay = `${item.title} ${item.url} ${item.note} ${item.tags.join(' ')} ${item.section}`.toLowerCase();
            return query.split(/\s+/).every((w) => hay.includes(w));
        }

        // Search looks across everything; sections and tags narrow the view otherwise.
        function inView() {
            return db.items.filter((i) => (query ? true : inFilter(i, filter)) && matchesQuery(i) && (!tagFilter || i.tags.includes(tagFilter)));
        }

        function sorted(items) {
            const by = {
                newest: (a, b) => b.added - a.added,
                oldest: (a, b) => a.added - b.added,
                az: (a, b) => a.title.localeCompare(b.title),
                domain: (a, b) => domainOf(a.url).localeCompare(domainOf(b.url)) || a.title.localeCompare(b.title)
            }[sort];
            return [...items].sort((a, b) => (b.starred - a.starred) || by(a, b));
        }

        // ---------- focus & motion helpers ----------
        // Re-rendering replaces the focused control; put focus back on its replacement.
        function keepFocus(fn) {
            const a = document.activeElement;
            const card = a && a.closest && a.closest('.card');
            let sel = null;
            if (a && a !== document.body) {
                if (a.id) sel = '#' + CSS.escape(a.id);
                else if (card && a.dataset.act) sel = `.card[data-id="${card.dataset.id}"] [data-act="${a.dataset.act}"]`;
                else if (card && a.classList.contains('card-link')) sel = `.card[data-id="${card.dataset.id}"] .card-link`;
                else if (card && a.dataset.move !== undefined) sel = `.card[data-id="${card.dataset.id}"] [data-move]`;
                else if (a.dataset.filter != null) sel = `#nav [data-filter="${CSS.escape(a.dataset.filter)}"]`;
                else if (a.dataset.group) sel = `[data-group="${CSS.escape(a.dataset.group)}"]`;
                else if (a.dataset.tag) sel = `${a.closest('#tagsRow') ? '#tagsRow' : '#results'} [data-tag="${CSS.escape(a.dataset.tag)}"]`;
            }
            fn();
            const next = sel && document.querySelector(sel);
            if (next && next !== document.activeElement) next.focus({ preventScroll: true });
        }

        // Keyboard-started changes skip the animation; pointer-started ones keep it.
        function instant(els, fn) {
            els = [].concat(els).filter(Boolean);
            els.forEach((el) => (el.style.transition = 'none'));
            fn();
            els.forEach((el) => { void el.offsetWidth; el.style.transition = ''; });
        }

        // FLIP: cards that survive a re-render glide from their old slot to the new one.
        function flip(mutate) {
            if (reduced()) return mutate();
            const before = new Map([...$$('#results .card')].map((c) => [c.dataset.id, c.getBoundingClientRect()]));
            mutate();
            const vh = innerHeight;
            $$('#results .card').forEach((c) => {
                const a = before.get(c.dataset.id);
                if (!a) return;
                const b = c.getBoundingClientRect();
                const dx = a.left - b.left, dy = a.top - b.top;
                if (!dx && !dy) return;
                if ((a.bottom < 0 || a.top > vh) && (b.bottom < 0 || b.top > vh)) return;
                if (Math.abs(dy) > vh * 0.75) { c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease' }); return; }
                c.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 260, easing: EASE_MOVE });
            });
        }

        // A section's count rolls up when something lands in it.
        function bumpCount(f) {
            if (reduced()) return;
            const el = $(`#nav [data-filter="${CSS.escape(f)}"] .count`);
            if (el) el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE_OUT });
        }

        // ---------- rendering ----------
        function renderNav() {
            const custom = customSections();
            if (isSection(filter) && !SECTIONS.includes(filter) && !custom.includes(filter)) filter = ALL;
            const count = (f) => db.items.filter((i) => inFilter(i, f)).length;
            const item = (f, ic) => {
                const c = count(f);
                return `<button class="nav-item press${c ? '' : ' is-empty'}" data-filter="${esc(f)}" aria-current="${!query && filter === f}">${ic ? icon(ic) : ''}<span>${esc(f)}</span><i class="count" aria-hidden="true">${c || ''}</i><span class="sr-only">, ${plural(c, 'link')}</span></button>`;
            };
            const group = (name, ic, sections) => {
                const shut = collapsed.has(name) && !sections.includes(filter);
                const total = sections.reduce((t, s) => t + count(s), 0);
                return `<div class="nav-group${shut ? ' shut' : ''}">
                    <button class="nav-label press" data-group="${esc(name)}" aria-expanded="${!shut}">${icon(ic)}<span>${esc(name)}</span>${total ? `<i class="count" aria-hidden="true">${total}</i>` : ''}<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>
                    <div class="nav-sections">${sections.map((s) => item(s)).join('')}</div>
                </div>`;
            };
            const tipHidden = store.get(TIP_KEY) === 'hidden';
            $('#nav').innerHTML = item(ALL, 'all') + item(STARRED, 'star') + item(INBOX, 'inbox')
                + TAXONOMY.map((g) => group(g.group, g.icon, g.sections)).join('')
                + (custom.length ? group('Other', 'hash', custom) : '')
                + (tipHidden ? '' : tipHtml());
            wireBookmarklet();
        }

        // Inbox triage select: all sections, grouped.
        function sectionOptions(current, { forCard = false } = {}) {
            const custom = customSections();
            const opt = (s) => `<option value="${esc(s)}"${s === current ? ' selected' : ''}>${esc(s)}</option>`;
            return (forCard ? '<option value="" selected disabled>Move to…</option>' : `<option value=""${!current ? ' selected' : ''}>Inbox (unsorted)</option>`)
                + TAXONOMY.map((g) => `<optgroup label="${esc(g.group)}">${g.sections.map(opt).join('')}</optgroup>`).join('')
                + (custom.length ? `<optgroup label="Other">${custom.map(opt).join('')}</optgroup>` : '')
                + (forCard ? '' : '<option value="__new">New section…</option>');
        }

        const MAX_CARD_TAGS = 4;
        function cardHtml(item, order, ctx) {
            const domain = domainOf(item.url);
            const name = esc(item.title || domain);
            const showSection = item.section && (query || !isSection(filter));
            const tags = item.tags.slice(0, MAX_CARD_TAGS).map((t) => `<button class="tag press" data-tag="${esc(t)}" title="Show links tagged #${esc(t)}"><span class="t">#<bdi>${esc(t)}</bdi></span></button>`).join('')
                + (item.tags.length > MAX_CARD_TAGS ? `<span class="tag more" title="${esc(item.tags.slice(MAX_CARD_TAGS).map((t) => '#' + t).join(' '))}">+${item.tags.length - MAX_CARD_TAGS}</span>` : '');
            return `<article class="card${order >= 0 ? ' new' : ''}" data-id="${item.id}"${order >= 0 ? ` style="--i:${Math.min(order, 6)}"` : ''}${ctx.draggable ? ' draggable="true"' : ''}>
                <div class="card-top">
                    ${tile(item)}
                    ${item.starred ? `<svg class="star-mark" aria-hidden="true"><use href="#i-star"/></svg>` : ''}
                    <div class="card-actions">
                        <button class="icon-btn press${item.starred ? ' on' : ''}" data-act="star" aria-pressed="${item.starred}" aria-label="Star ${name}" title="Star (S)">${icon('star')}</button>
                        <button class="icon-btn press" data-act="edit" aria-label="Edit ${name}" title="Edit (E)">${icon('pen')}</button>
                    </div>
                </div>
                <div class="card-body">
                    <h3 class="card-title"><a class="card-link" href="${esc(item.url)}" target="_blank" rel="noopener" dir="auto" aria-keyshortcuts="E S M Delete">${name}</a></h3>
                    <p class="card-meta"><span>${esc(domain)}</span>${showSection ? `<span dir="auto">${esc(item.section)}</span>` : ''}</p>
                    ${item.note ? `<p class="card-note" dir="auto">${esc(item.note)}</p>` : ''}
                </div>
                <div class="card-tags">${tags}</div>
                ${ctx.triage ? `<label class="move"><span class="sr-only">Move ${name} to a section</span><select data-move>${ctx.cardOptions}</select></label>` : ''}
            </article>`;
        }

        function emptyHtml() {
            if (query || tagFilter) {
                const what = query ? `“${esc(query)}”` : `#${esc(tagFilter)}`;
                return `<div class="empty"><h2>No links match ${what}</h2><p>Check the spelling, or search for a site’s address.</p><div class="actions"><button class="btn-ghost press" data-action="clear-filters">Clear ${query ? 'search' : 'tag'}</button></div></div>`;
            }
            if (!db.items.length && !cloud.ready) return `<div class="empty"><h2>Loading links…</h2></div>`;
            if (!db.items.length && !cloud.editor) return `<div class="empty"><h2>No links yet</h2></div>`;
            if (!db.items.length) {
                const how = matchMedia('(pointer: coarse)').matches
                    ? 'Paste a link in the bar above and tap Save. You can paste several at once.'
                    : `Paste a link anywhere on this page with ${MOD} V. You can paste several at once.`;
                return `<div class="empty"><h2>Library is empty</h2><p>${how}</p><div class="actions"><button class="btn-ghost press" data-action="starters">${icon('plus')}Add ${STARTERS.length} starter links</button></div></div>`;
            }
            if (filter === INBOX) return `<div class="empty"><h2>Inbox is empty</h2><p>Links you save without choosing a section wait here until you sort them.</p></div>`;
            if (filter === STARRED) return `<div class="empty"><h2>No starred links</h2><p>Star the links you use most and they’ll collect here.</p></div>`;
            return `<div class="empty"><h2>Nothing in ${esc(filter)} yet</h2><p>Paste a link while you’re here to save it to this section${matchMedia('(pointer: fine)').matches ? ', or drag a card onto it in the sidebar' : ''}.</p></div>`;
        }

        function renderResults(newIds = []) {
            const items = sorted(inView());
            const el = $('#results');
            el.className = `results ${view}`;
            const fresh = newIds.length <= 12 ? newIds : [];
            let n = 0;
            const ctx = {
                draggable: cloud.editor && matchMedia('(pointer: fine)').matches,
                triage: cloud.editor && filter === INBOX && !query,
                cardOptions: filter === INBOX && !query ? sectionOptions('', { forCard: true }) : ''
            };
            el.innerHTML = items.length ? items.map((i) => cardHtml(i, fresh.includes(i.id) ? n++ : -1, ctx)).join('') : emptyHtml();
            const title = query ? 'Search' : tagFilter ? `#${tagFilter}` : filter;
            $('#viewTitle').innerHTML = `${esc(title)}<span class="n" aria-hidden="true">${items.length}</span><span class="sr-only">, ${plural(items.length, 'link')}</span>`;
            $('#resultStatus').textContent = query || tagFilter ? `${plural(items.length, 'link')} found` : '';
            $('#addInput').placeholder = isPhone() ? `Add links to ${destination()}` : `Paste links to save to ${destination()}`;
        }

        function renderTags() {
            const counts = new Map();
            db.items.filter((i) => (query ? true : inFilter(i, filter)) && matchesQuery(i)).forEach((i) => i.tags.forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
            const top = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 14);
            if (tagFilter && !counts.has(tagFilter)) top.unshift([tagFilter, 0]);
            $('#tagsRow').innerHTML = top.map(([t, c]) => `<button class="chip press" data-tag="${esc(t)}" aria-pressed="${tagFilter === t}"><span class="t">#<bdi>${esc(t)}</bdi></span>${tagFilter === t ? icon('x') : `<span class="c" aria-hidden="true">${c}</span>`}</button>`).join('');
            // tag suggestions for the editor, most used first
            const all = new Map();
            db.items.forEach((i) => i.tags.forEach((t) => all.set(t, (all.get(t) || 0) + 1)));
            $('#tagList').innerHTML = [...all].sort((a, b) => b[1] - a[1]).map(([t]) => `<option value="${esc(t)}">`).join('');
        }

        function renderView() {
            $$('.seg [data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
            $('#sortLabel').textContent = SORTS.find((s) => s.id === sort).label;
        }

        function ago(t) {
            const days = Math.floor((Date.now() - t) / 864e5);
            if (days <= 0) return 'today';
            if (days === 1) return 'yesterday';
            return `${days} days ago`;
        }

        function renderBackup() {
            const n = backup.changed.length;
            const b = $('#backupBtn');
            const label = n ? `Back up · ${n}` : backup.at ? `Backed up ${ago(backup.at)}` : 'Back up';
            const full = n ? `Back up · ${plural(n, 'change')} since your last backup` : `${label} · download a backup file`;
            $('#backupLabel').textContent = label;
            b.setAttribute('aria-label', full);
            b.title = full;
            b.classList.toggle('due', n > 0);
        }

        function render(newIds) {
            keepFocus(() => {
                renderNav();
                renderTags();
                renderResults(newIds);
                renderView();
            });
        }

        // ---------- save from any site (bookmarklet) ----------
        const PAGE = location.origin + location.pathname;
        const bookmarkletHref = () => `javascript:(()=>{window.open('${PAGE}?add='+encodeURIComponent(location.href)+'&title='+encodeURIComponent(document.title),'kuruin-library')})()`;

        function tipHtml() {
            return `<div class="tip">
                <div class="tip-head"><span>Save from any site</span><button class="icon-btn press" data-action="hide-tip" aria-label="Hide this tip">${icon('x')}</button></div>
                <p>Drag this button to your bookmarks bar. Click it on any page to save that page here, with its real title.</p>
                <p><a class="bookmarklet" draggable="true">${icon('plus')}Save to Library</a></p>
            </div>`;
        }

        function wireBookmarklet() {
            $$('.bookmarklet').forEach((a) => {
                a.href = bookmarkletHref();
                a.onclick = (e) => { e.preventDefault(); toast('Drag this button to your bookmarks bar, then click it on any site'); };
            });
        }

        // ---------- adding ----------
        function setAddError(msg) {
            const hint = $('#addHint');
            hint.textContent = msg || '';
            hint.classList.toggle('error', !!msg);
            if (msg) $('#addInput').setAttribute('aria-invalid', 'true');
            else $('#addInput').removeAttribute('aria-invalid');
        }

        function addLinks(text, opts = {}) {
            if (!canEdit()) return 0;
            const urls = [...new Set(extractUrls(text))];
            if (!urls.length) {
                setAddError('No link found. Paste a web address, like lucide.dev');
                return 0;
            }
            setAddError('');

            const keys = new Set(db.items.map((i) => urlKey(i.url)));
            const section = opts.section ?? (isSection(filter) ? filter : '');
            const added = [];
            let dupes = 0;
            urls.forEach((url) => {
                if (keys.has(urlKey(url))) { dupes++; return; }
                keys.add(urlKey(url));
                const title = urls.length === 1 && str(opts.title) ? cleanPageTitle(opts.title, url) || titleFromUrl(url) : titleFromUrl(url);
                added.push({ id: uid(), url, title, section, tags: opts.tags || [], note: '', starred: !opts.silent && filter === STARRED, added: Date.now() + added.length, updated: Date.now() });
            });

            if (!added.length) {
                const existing = db.items.find((i) => urlKey(i.url) === urlKey(urls[0]));
                toast(urls.length === 1 ? `Already saved in ${existing.section || INBOX}` : 'All of those links are already saved');
                if (urls.length === 1) revealItem(existing.id);
                return 0;
            }

            db.items.push(...added);
            persist(true);
            added.forEach((a) => markChanged(a.id));
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
            if (!opts.silent) {
                // keep the new links visible: leave a search or tag filter that would hide them
                if (query || tagFilter) { query = ''; tagFilter = ''; $('#search').value = ''; }
                render(added.map((a) => a.id));
                const card = $(`.card[data-id="${added[0].id}"]`);
                if (card) card.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
                const where = section || INBOX;
                const msg = added.length === 1 ? `Saved to ${where}` : `Saved ${plural(added.length, 'link')} to ${where}${dupes ? ` · ${dupes} already saved` : ''}`;
                toast(msg, added.length === 1
                    ? { action: { label: 'Edit', onClick: () => openDrawer(added[0].id) }, cancel: { label: 'Undo', onClick: () => undoAdd(added) } }
                    : { action: { label: 'Undo', onClick: () => undoAdd(added) } });
            }
            return added.length;
        }

        function undoAdd(added) {
            const ids = new Set(added.map((a) => a.id));
            db.items = db.items.filter((i) => !ids.has(i.id));
            if (ids.has(editingId)) closeDrawer();
            persist(true);
            backup.changed = backup.changed.filter((id) => !ids.has(id));
            store.set(BACKUP_KEY, JSON.stringify(backup));
            renderBackup();
            flip(() => render());
        }

        // Scroll an item into view (leaving any filter that hides it) and flash it.
        function revealItem(id) {
            const item = db.items.find((i) => i.id === id);
            if (!item) return;
            if (!inView().includes(item)) { filter = ALL; query = ''; tagFilter = ''; $('#search').value = ''; render(); }
            const card = $(`.card[data-id="${id}"]`);
            if (card) {
                card.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
                card.classList.remove('new');
                void card.offsetWidth;
                card.classList.add('new');
            }
        }

        $('#addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = $('#addInput');
            if (addLinks(input.value)) input.value = '';
        });
        $('#addInput').addEventListener('input', () => setAddError(''));

        // pasting into the empty add bar saves right away
        $('#addInput').addEventListener('paste', (e) => {
            const text = e.clipboardData.getData('text');
            if (!extractUrls(text).length || $('#addInput').value.trim()) return;
            e.preventDefault();
            addLinks(text);
        });

        // pasting anywhere else on the page (outside a text field) saves too
        document.addEventListener('paste', (e) => {
            if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
            const text = e.clipboardData.getData('text');
            if (!extractUrls(text).length) return;
            e.preventDefault();
            addLinks(text);
        });

        // ---------- item actions ----------
        const find = (id) => db.items.find((i) => i.id === id);

        function toggleStar(id, btn, { quiet = false } = {}) {
            if (!canEdit()) return;
            const item = find(id);
            item.starred = !item.starred;
            item.updated = Date.now();
            persist();
            markChanged(id);
            // update the button in place first, so the pop can finish before the list reorders
            if (btn) { btn.classList.toggle('on', item.starred); btn.setAttribute('aria-pressed', String(item.starred)); }
            const pop = btn && item.starred && !quiet && !reduced();
            if (pop) btn.querySelector('svg').animate([
                { transform: 'scale(1)', easing: EASE_OUT },
                { transform: 'scale(0.85)', offset: 0.3, easing: EASE_OUT },
                { transform: 'scale(1.15)', offset: 0.65, easing: EASE_OUT },
                { transform: 'scale(1)' }
            ], { duration: 280 });
            setTimeout(() => {
                quiet ? render() : flip(() => render());
                if (editingId === id) keepFocus(renderDrawer);
            }, pop ? 280 : 0);
        }

        function moveItem(id, section, { quiet = false } = {}) {
            const item = find(id);
            if (!item || item.section === section || !canEdit()) return;
            const before = item.section;
            item.section = section;
            item.updated = Date.now();
            persist(true);
            markChanged(id);
            const go = () => { render(); if (editingId === id) keepFocus(renderDrawer); bumpCount(section || INBOX); };
            quiet ? go() : flip(go);
            toast(`Moved to ${section || INBOX}`, {
                action: { label: 'Undo', onClick: () => { item.section = before; persist(true); flip(() => render()); if (editingId === id) renderDrawer(); } }
            });
        }

        // A card that's leaving the current view slides out before the list closes the gap.
        function leaveThen(id, fn, toSide = false) {
            const card = $(`.card[data-id="${id}"]`);
            if (!card || reduced()) return fn();
            card.style.pointerEvents = 'none';
            card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: toSide ? 'translateX(-16px) scale(0.96)' : 'scale(0.96)' }], { duration: toSide ? 180 : 150, easing: EASE_OUT, fill: 'forwards' }).finished.then(fn);
        }

        function deleteItem(id, { animate = true } = {}) {
            const idx = db.items.findIndex((i) => i.id === id);
            if (idx < 0 || !canEdit()) return;
            // keyboard deletes move focus to the next card, so you can keep going
            const cards = [...$$('#results .card')];
            const pos = cards.findIndex((c) => c.dataset.id === id);
            const nextId = (cards[pos + 1] || cards[pos - 1] || {}).dataset?.id;
            const [item] = db.items.splice(idx, 1);
            persist(true);
            markChanged(id);
            const finish = () => {
                (animate ? flip : (f) => f())(() => render());
                const next = nextId && $(`.card[data-id="${nextId}"] .card-link`);
                (next || $('#results')).focus({ preventScroll: true });
            };
            if (editingId === id) { closeDrawer({ refocus: false }); finish(); }
            else if (animate) leaveThen(id, finish);
            else finish();
            toast(`Deleted “${item.title}”`, {
                persist: true,
                action: { label: 'Undo', onClick: () => { db.items.splice(idx, 0, item); persist(true); flip(() => render([item.id])); } }
            });
        }

        $('#results').addEventListener('click', (e) => {
            const tag = e.target.closest('[data-tag]');
            if (tag) { setTag(tag.dataset.tag); return; }
            const act = e.target.closest('[data-act]');
            if (!act) return;
            const id = act.closest('.card').dataset.id;
            const fromKeys = e.detail === 0;
            if (act.dataset.act === 'star') toggleStar(id, act, { quiet: fromKeys });
            if (act.dataset.act === 'edit') fromKeys ? instant([drawer, $('#drawerScrim')], () => openDrawer(id, act)) : openDrawer(id, act);
        });

        // Inbox triage: picking a section on the card files it straight away
        $('#results').addEventListener('change', (e) => {
            const sel = e.target.closest('[data-move]');
            if (!sel || !sel.value) return;
            const id = sel.closest('.card').dataset.id;
            const section = sel.value;
            leaveThen(id, () => moveItem(id, section));
        });

        // keyboard on a focused card link: E edit, S star, M move, Delete remove
        $('#results').addEventListener('keydown', (e) => {
            const card = e.target.closest('.card');
            if (!card || e.target !== card.querySelector('.card-link') || e.ctrlKey || e.metaKey || e.altKey) return;
            const id = card.dataset.id;
            if (e.key === 'e' || e.key === 'E') { e.preventDefault(); instant([drawer, $('#drawerScrim')], () => openDrawer(id, e.target)); }
            else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleStar(id, card.querySelector('[data-act="star"]'), { quiet: true }); }
            else if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                const sel = card.querySelector('[data-move]');
                if (sel) sel.focus();
                else instant([drawer, $('#drawerScrim')], () => openDrawer(id, e.target, '#fSection'));
            }
            else if (e.key === 'Delete') { e.preventDefault(); deleteItem(id, { animate: false }); }
        });

        // ---------- drag a card onto a section (pointer only; the editor and Inbox select are the alternatives) ----------
        let dragId = null;
        $('#results').addEventListener('dragstart', (e) => {
            const card = e.target.closest('.card');
            if (!card) return;
            dragId = card.dataset.id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', find(dragId).url);
            requestAnimationFrame(() => card.classList.add('dragging'));
        });
        $('#results').addEventListener('dragend', () => {
            $$('.card.dragging').forEach((c) => c.classList.remove('dragging'));
            $$('.nav-item.drop').forEach((n) => n.classList.remove('drop'));
            dragId = null;
        });
        $('#nav').addEventListener('dragover', (e) => {
            const target = e.target.closest('[data-filter]');
            if (!dragId || !target || target.dataset.filter === ALL) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            $$('.nav-item.drop').forEach((n) => n !== target && n.classList.remove('drop'));
            target.classList.add('drop');
        });
        $('#nav').addEventListener('dragleave', (e) => {
            const target = e.target.closest('[data-filter]');
            if (target && !target.contains(e.relatedTarget)) target.classList.remove('drop');
        });
        $('#nav').addEventListener('drop', (e) => {
            const target = e.target.closest('[data-filter]');
            if (!dragId || !target) return;
            e.preventDefault();
            const id = dragId;
            const f = target.dataset.filter;
            if (f === STARRED) { if (!find(id).starred) toggleStar(id); return; }
            const section = f === INBOX ? '' : f;
            const leaves = !query && filter !== ALL && filter !== STARRED && f !== filter;
            leaves ? leaveThen(id, () => moveItem(id, section), true) : moveItem(id, section);
        });

        // ---------- edit drawer (modal) ----------
        const drawer = $('#drawer');
        let drawerReturn = null;

        function sectionNameError(v) {
            if (!v) return 'Enter a name for the new section.';
            if (RESERVED.some((r) => r.toLowerCase() === v.toLowerCase())) return `“${v}” is a built-in view. Choose another name.`;
            return '';
        }

        function renderDrawer() {
            const item = find(editingId);
            if (!item) return closeDrawer();
            const name = esc(item.title || domainOf(item.url));
            drawer.innerHTML = `
                <div class="drawer-head">
                    ${tile(item)}
                    <h2 id="drawerTitle">Edit link</h2>
                    <a class="icon-btn press" href="${esc(item.url)}" target="_blank" rel="noopener" aria-label="Open ${name} in a new tab" title="Open">${icon('external')}</a>
                    <button class="icon-btn press" data-action="drawer-close" aria-label="Close editor" title="Close (Esc)">${icon('x')}</button>
                </div>
                <div class="drawer-body">
                    <label class="field"><span>Title</span><input class="input" id="fTitle" value="${esc(item.title)}" autocomplete="off" dir="auto" maxlength="200"></label>
                    <div class="field">
                        <label class="label" for="fUrl">Link</label>
                        <input class="input" id="fUrl" type="url" inputmode="url" value="${esc(item.url)}" spellcheck="false" autocomplete="off" aria-describedby="fUrlError">
                        <p class="field-error" id="fUrlError" aria-live="polite"></p>
                    </div>
                    <div class="field">
                        <label class="label" for="fSection">Section</label>
                        <select class="input" id="fSection">${sectionOptions(item.section)}</select>
                        <div class="new-section" id="newSection" hidden>
                            <label class="label" for="fNewSection">Name the new section, then press Enter</label>
                            <input class="input" id="fNewSection" maxlength="40" placeholder="Brand references" aria-describedby="fNewSectionError" autocomplete="off">
                            <p class="field-error" id="fNewSectionError" aria-live="polite"></p>
                        </div>
                    </div>
                    <div class="field"><span class="label" id="tagsLabel">Tags</span>
                        <div class="input tag-input" id="tagBox">${item.tags.map((t) => `<span class="tag"><span class="t">#<bdi>${esc(t)}</bdi></span><button type="button" data-untag="${esc(t)}" aria-label="Remove tag ${esc(t)}">${icon('x')}</button></span>`).join('')}<input id="fTag" list="tagList" placeholder="${item.tags.length ? 'Add another' : 'free, react, dark'}" aria-labelledby="tagsLabel" autocomplete="off" spellcheck="false" maxlength="48"></div>
                    </div>
                    <label class="field"><span>Note</span><textarea class="input" id="fNote" rows="4" placeholder="Great for empty-state illustrations" dir="auto" maxlength="2000">${esc(item.note)}</textarea></label>
                </div>
                <div class="drawer-foot">
                    <span class="meta">Added ${new Date(item.added).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                    <button class="btn-quiet press${item.starred ? ' on' : ''}" id="fStar" aria-pressed="${item.starred}">${icon('star')}${item.starred ? 'Starred' : 'Star'}</button>
                    <button class="btn-quiet press" id="fDelete">${icon('trash')}Delete</button>
                </div>`;

            const touch = () => { item.updated = Date.now(); persist(); };
            const changed = () => { markChanged(item.id); keepFocus(() => { renderNav(); renderTags(); renderResults(); }); };

            $('#fTitle').addEventListener('input', (e) => { item.title = e.target.value; touch(); });
            $('#fTitle').addEventListener('change', (e) => { if (!e.target.value.trim()) { item.title = titleFromUrl(item.url); e.target.value = item.title; touch(); } changed(); });
            $('#fNote').addEventListener('input', (e) => { item.note = e.target.value; touch(); });
            $('#fNote').addEventListener('change', changed);

            const urlField = $('#fUrl');
            const urlError = (msg) => { $('#fUrlError').textContent = msg; msg ? urlField.setAttribute('aria-invalid', 'true') : urlField.removeAttribute('aria-invalid'); };
            urlField.addEventListener('input', () => urlError(''));
            urlField.addEventListener('change', () => {
                const url = normalizeUrl(urlField.value);
                if (!url) return urlError('Link not changed. Enter a full web address, like https://lucide.dev');
                const dupe = db.items.find((i) => i !== item && urlKey(i.url) === urlKey(url));
                if (dupe) return urlError(`Link not changed. It’s already saved as “${dupe.title}”.`);
                item.url = url;
                touch();
                changed();
                keepFocus(renderDrawer);
            });

            const sectionSel = $('#fSection');
            const newBox = $('#newSection');
            const newInput = $('#fNewSection');
            sectionSel.addEventListener('change', () => {
                if (sectionSel.value === '__new') {
                    sectionSel.value = item.section;
                    newBox.hidden = false;
                    newInput.focus();
                    return;
                }
                moveItem(item.id, sectionSel.value);
            });
            newInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); newBox.hidden = true; sectionSel.focus(); return; }
                if (e.key !== 'Enter') return;
                e.preventDefault();
                const v = newInput.value.trim();
                const err = sectionNameError(v);
                if (err) { $('#fNewSectionError').textContent = err; newInput.setAttribute('aria-invalid', 'true'); return; }
                const existing = [...SECTIONS, ...customSections()].find((s) => s.toLowerCase() === v.toLowerCase());
                moveItem(item.id, existing || v);
                $('#fSection').focus();
            });
            newInput.addEventListener('input', () => { $('#fNewSectionError').textContent = ''; newInput.removeAttribute('aria-invalid'); });

            const addTag = (raw) => {
                const tags = cleanTags(raw.split(','));
                if (!tags.length) return;
                item.tags = [...new Set([...item.tags, ...tags])];
                touch(); changed(); renderDrawer(); $('#fTag').focus();
            };
            $('#fTag').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(e.target.value); }
                if (e.key === 'Backspace' && !e.target.value && item.tags.length) {
                    item.tags = item.tags.slice(0, -1);
                    touch(); changed(); renderDrawer(); $('#fTag').focus();
                }
            });
            $('#fTag').addEventListener('change', (e) => { if (e.target.value.trim() && item.tags.length < 50) addTag(e.target.value); });
            $('#tagBox').addEventListener('click', (e) => {
                const un = e.target.closest('[data-untag]');
                if (un) { item.tags = item.tags.filter((t) => t !== un.dataset.untag); touch(); changed(); renderDrawer(); $('#fTag').focus(); }
                else if (e.target.id === 'tagBox') $('#fTag').focus();
            });
            $('#fStar').addEventListener('click', () => { toggleStar(item.id, null, { quiet: true }); });
            $('#fDelete').addEventListener('click', () => deleteItem(item.id));
        }

        function openDrawer(id, returnTo, focusSel = '#fTitle') {
            if (!canEdit()) return;
            editingId = id;
            drawerReturn = returnTo || document.activeElement;
            renderDrawer();
            closeNav();
            lib.classList.add('editing');
            drawer.classList.add('open');
            $('#main').inert = true;
            $('#side').inert = true;
            const f = $(focusSel);
            if (f) f.focus({ preventScroll: true });
        }

        function closeDrawer({ refocus = true } = {}) {
            if (!drawer.classList.contains('open')) return;
            const id = editingId;
            drawer.classList.remove('open');
            lib.classList.remove('editing');
            $('#main').inert = false;
            $('#side').inert = false;
            editingId = null;
            render();
            if (refocus) {
                // the original trigger was re-rendered; find its replacement
                const back = $(`.card[data-id="${id}"] [data-act="edit"]`) || $(`.card[data-id="${id}"] .card-link`);
                (back || (drawerReturn && drawerReturn.isConnected ? drawerReturn : $('#results'))).focus({ preventScroll: true });
            }
            drawerReturn = null;
        }

        // ---------- filters, tags, search ----------
        function setFilter(f) {
            filter = f;
            tagFilter = '';
            if (query) { query = ''; $('#search').value = ''; }
            closeNav(true);
            render();
            $('#scroll').scrollTop = 0;
        }

        function setTag(t) {
            tagFilter = tagFilter === t ? '' : t;
            render();
        }

        $('#nav').addEventListener('click', (e) => {
            const g = e.target.closest('[data-group]');
            if (g) {
                // fold in place, so the chevron turns and nothing else re-renders
                const group = g.parentElement;
                const name = g.dataset.group;
                const shut = !group.classList.contains('shut') && !group.querySelector('.nav-sections [aria-current="true"]');
                shut ? collapsed.add(name) : collapsed.delete(name);
                store.set(COLLAPSE_KEY, JSON.stringify([...collapsed]));
                group.classList.toggle('shut', shut);
                g.setAttribute('aria-expanded', String(!shut));
                if (!shut && e.detail !== 0 && !reduced()) group.querySelector('.nav-sections').animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], { duration: 180, easing: EASE_OUT });
                return;
            }
            const f = e.target.closest('[data-filter]');
            if (f) setFilter(f.dataset.filter);
        });

        $('#tagsRow').addEventListener('click', (e) => {
            const t = e.target.closest('[data-tag]');
            if (t) setTag(t.dataset.tag);
        });

        $('#search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); keepFocus(() => { renderNav(); renderTags(); renderResults(); }); });
        $('#search').addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && e.target.value) { e.stopPropagation(); e.target.value = ''; query = ''; render(); }
            else if (e.key === 'Escape') e.target.blur();
            else if (e.key === 'Enter') {
                // Enter opens the top result: search becomes a quick switcher
                const first = $('#results .card-link');
                if (first) { e.preventDefault(); window.open(first.href, '_blank', 'noopener'); }
            }
            else if (e.key === 'ArrowDown') { const first = $('#results .card-link'); if (first) { e.preventDefault(); first.focus(); } }
        });

        $$('.seg [data-view]').forEach((b) => b.addEventListener('click', (e) => {
            if (b.dataset.view === view) return;
            view = b.dataset.view;
            store.set(VIEW_KEY, view);
            renderView();
            renderResults();
            const r = $('#results');
            if (e.detail !== 0 && !reduced()) r.animate([{ opacity: 0, filter: r.children.length > 60 ? 'none' : 'blur(2px)' }, { opacity: 1, filter: 'none' }], { duration: 160, easing: EASE_OUT });
        }));

        // ---------- sort menu ----------
        const sortMenu = $('#sortMenu');
        function openSort() {
            sortMenu.innerHTML = SORTS.map((s) => `<button role="menuitemradio" aria-checked="${s.id === sort}" data-sort="${s.id}">${icon('tick')}<span>${s.label}</span></button>`).join('');
            const r = $('#sortBtn').getBoundingClientRect();
            sortMenu.classList.add('show');
            const left = Math.max(8, Math.min(r.right - sortMenu.offsetWidth, innerWidth - sortMenu.offsetWidth - 8));
            sortMenu.style.top = r.bottom + 6 + 'px';
            sortMenu.style.left = left + 'px';
            sortMenu.style.transformOrigin = `${r.left + r.width / 2 - left}px -6px`; // grow out of the button
            $('#sortBtn').setAttribute('aria-expanded', 'true');
            (sortMenu.querySelector('[aria-checked="true"]') || sortMenu.firstElementChild).focus();
        }
        function closeSort(refocus = true) {
            sortMenu.classList.remove('show');
            $('#sortBtn').setAttribute('aria-expanded', 'false');
            if (refocus) $('#sortBtn').focus();
        }
        $('#sortBtn').addEventListener('click', (e) => {
            const go = () => (sortMenu.classList.contains('show') ? closeSort() : openSort());
            e.detail === 0 ? instant(sortMenu, go) : go();
        });
        sortMenu.addEventListener('click', (e) => {
            const b = e.target.closest('[data-sort]');
            if (!b) return;
            sort = b.dataset.sort;
            store.set(SORT_KEY, sort);
            e.detail === 0 ? instant(sortMenu, closeSort) : closeSort();
            renderView();
            renderResults();
        });
        sortMenu.addEventListener('keydown', (e) => {
            const items = [...sortMenu.querySelectorAll('button')];
            const i = items.indexOf(document.activeElement);
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
            if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
            if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
            if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); instant(sortMenu, closeSort); }
        });
        document.addEventListener('pointerdown', (e) => {
            if (sortMenu.classList.contains('show') && !sortMenu.contains(e.target) && !e.target.closest('#sortBtn')) closeSort(false);
        });

        // ---------- sidebar on small screens ----------
        function openNav() {
            lib.classList.add('nav-open');
            $('.menu-btn').setAttribute('aria-expanded', 'true');
            $('#main').inert = true;
            const cur = $('#nav [aria-current="true"]');
            (cur || $('#nav .nav-item')).focus({ preventScroll: true });
        }
        function closeNav(refocus = false) {
            if (!lib.classList.contains('nav-open')) return;
            lib.classList.remove('nav-open');
            $('.menu-btn').setAttribute('aria-expanded', 'false');
            if (!lib.classList.contains('editing')) $('#main').inert = false;
            if (refocus && isNarrow()) $('.menu-btn').focus({ preventScroll: true });
        }

        // ---------- toasts (Sonner, with a plain fallback) ----------
        let sonner = null;
        const SONNER_PIN = '?deps=react@18.3.1,react-dom@18.3.1';
        async function loadSonner() {
            try {
                const [React, ReactDOM, s] = await Promise.all([
                    import(`https://esm.sh/react@18.3.1${SONNER_PIN}`),
                    import(`https://esm.sh/react-dom@18.3.1/client${SONNER_PIN}`),
                    import(`https://esm.sh/sonner@1.7.4${SONNER_PIN}`)
                ]);
                const host = document.createElement('div');
                document.body.appendChild(host);
                const root = ReactDOM.createRoot(host);
                const renderToaster = () => root.render(React.createElement(s.Toaster, {
                    // on phones the bottom sheet's buttons live at the bottom, so toasts go up top
                    position: isPhone() ? 'top-center' : 'bottom-center',
                    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
                    gap: 8,
                    offset: 24,
                    toastOptions: {
                        style: { fontFamily: 'var(--sans)', fontSize: '13px', borderRadius: '12px', padding: '12px 14px', background: 'var(--elevated)', color: 'var(--text)', border: '1px solid var(--border)', boxShadow: 'var(--shadow)' },
                        actionButtonStyle: { background: 'var(--text)', color: 'var(--inverse)', borderRadius: '7px', fontWeight: 500, height: '26px', padding: '0 10px' },
                        cancelButtonStyle: { background: 'var(--hover)', color: 'var(--text)', borderRadius: '7px', fontWeight: 500, height: '26px', padding: '0 10px' }
                    }
                }));
                renderToaster();
                sonner = { toast: s.toast, render: renderToaster };
            } catch { sonner = false; }
        }

        // Plain messages leave after 3s. Save/move toasts offer Edit/Undo for 8s (pausing on hover);
        // the change can also be reversed from the card. Delete's Undo is the only way back, so it stays until closed.
        let toastTimer;
        function toast(message, opts = {}) {
            if (sonner) {
                sonner.toast(message, opts.action
                    ? { id: 'action', duration: opts.persist ? Infinity : 8000, closeButton: true, action: opts.action, cancel: opts.cancel }
                    : { duration: 3000 });
                return;
            }
            const el = $('#toast');
            clearTimeout(toastTimer);
            el.innerHTML = `<span>${esc(message)}</span>${opts.action ? `<button class="act">${esc(opts.action.label)}</button><button class="dismiss" aria-label="Dismiss">${icon('x')}</button>` : ''}`;
            if (opts.action) {
                el.querySelector('.act').onclick = () => { el.classList.remove('show'); opts.action.onClick(); };
                el.querySelector('.dismiss').onclick = () => el.classList.remove('show');
            }
            el.classList.add('show');
            if (!opts.action || !opts.persist) toastTimer = setTimeout(() => el.classList.remove('show'), opts.action ? 8000 : 3000);
        }

        // ---------- theme, import, export ----------
        function applyTheme(t) {
            const freeze = document.createElement('style');
            freeze.textContent = '*,*::before,*::after{transition:none!important}';
            document.head.appendChild(freeze);
            document.documentElement.dataset.theme = t;
            const label = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
            $('#themeBtn').setAttribute('aria-label', label);
            $('#themeBtn').title = label;
            $('#themeBtn use').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
            $('meta[name="theme-color"]').content = t === 'dark' ? '#0c0c0d' : '#f5f5f4';
            store.set(THEME_KEY, t);
            if (sonner) sonner.render();
            void document.body.offsetHeight;
            // lift the freeze after the next frame; the timer covers background tabs, where frames don't run
            const lift = () => freeze.remove();
            requestAnimationFrame(() => requestAnimationFrame(lift));
            setTimeout(lift, 120);
        }

        const actions = {
            theme: () => {
                const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                if (!document.startViewTransition || reduced()) return applyTheme(next);
                document.startViewTransition(() => applyTheme(next));
            },
            export: () => {
                persist(true);
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(a.href);
                backup = { at: Date.now(), changed: [] };
                store.set(BACKUP_KEY, JSON.stringify(backup));
                renderBackup();
                toast(`Backup downloaded · ${plural(db.items.length, 'link')}`);
            },
            import: () => { if (canEdit()) $('#importFile').click(); },
            account: () => {
                if (!cloud.email) return openSignIn();
                toast(cloud.editor ? `Signed in as ${cloud.email}` : `Signed in as ${cloud.email} · this account can’t edit`, { action: { label: 'Sign out', onClick: signOut } });
            },
            'signin-close': () => signin.close(),
            starters: () => {
                if (!canEdit()) return;
                STARTERS.forEach(([url, section, tags]) => addLinks(url, { section, tags, silent: true }));
                render(db.items.map((i) => i.id));
                toast(`Added ${plural(STARTERS.length, 'starter link')}`);
            },
            'clear-filters': () => { query = ''; tagFilter = ''; $('#search').value = ''; render(); $('#search').focus(); },
            'hide-tip': () => { store.set(TIP_KEY, 'hidden'); renderNav(); $('#nav .nav-item').focus(); },
            'nav-open': openNav,
            'nav-close': () => closeNav(true),
            'drawer-close': () => closeDrawer()
        };

        document.addEventListener('click', (e) => {
            const b = e.target.closest('[data-action]');
            if (b && actions[b.dataset.action]) actions[b.dataset.action](e);
        });

        // Restore merges: links you already have are skipped, so restoring twice is harmless.
        $('#importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            let d;
            try { d = JSON.parse(await file.text()); } catch { d = null; }
            if (!d || !Array.isArray(d.items)) { toast('Unable to restore. Choose a data.json file downloaded from Library.'); return; }
            const fresh = cleanItems(d.items, new Set(db.items.map((i) => urlKey(i.url))))
                .map((i) => ({ ...i, id: db.items.some((x) => x.id === i.id) ? uid() : i.id }));
            if (!fresh.length) { toast('Nothing new to restore. Every link in that file is already here.'); return; }
            db.items.push(...fresh);
            persist(true);
            fresh.forEach((i) => markChanged(i.id));
            render(fresh.map((i) => i.id));
            toast(`Restored ${plural(fresh.length, 'link')}`, { action: { label: 'Undo', onClick: () => undoAdd(fresh) } });
        });

        // ---------- keyboard ----------
        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && e.key.toLowerCase() === 'k' && !lib.classList.contains('editing')) {
                e.preventDefault();
                closeNav();
                $('#search').focus();
                $('#search').select();
            } else if (e.key === 'Escape') {
                if (sortMenu.classList.contains('show')) instant(sortMenu, closeSort);
                else if (drawer.classList.contains('open')) instant([drawer, $('#drawerScrim')], () => closeDrawer());
                else if (lib.classList.contains('nav-open')) instant([$('#side'), $('#scrim')], () => closeNav(true));
                else if ($('#toast').classList.contains('show')) $('#toast').classList.remove('show');
            } else if (mod && e.key.toLowerCase() === 's') {
                e.preventDefault();
                persist(true);
                toast(cloud.editor ? 'Saved' : 'Nothing to save. Sign in to edit.');
            }
        });

        window.addEventListener('pagehide', () => persist(true));
        let wasPhone = isPhone();
        window.addEventListener('resize', () => {
            if (sortMenu.classList.contains('show')) closeSort(false);
            if (!isNarrow()) closeNav();
            if (isPhone() !== wasPhone) { wasPhone = isPhone(); if (sonner) sonner.render(); }
        });

        // ---------- init ----------
        (async () => {
            applyTheme(document.documentElement.dataset.theme || 'light');
            $('#searchKbd').textContent = `${MOD} K`;
            loadSonner();
            lib.classList.toggle('readonly', store.get(EDITOR_HINT_KEY) !== '1');
            db = await load();
            render();
            renderBackup();
            try {
                await connectCloud();
                render();
            } catch {
                cloud.ready = true;
                setEditor(false);
                toast(navigator.onLine ? 'Couldn’t load the latest links. Showing the copy saved in this browser.' : 'You’re offline. Showing the copy saved in this browser.');
            }

            // ?add=<url>&title=<page title>: sent by the bookmarklet (or a share sheet as ?text=)
            const params = new URLSearchParams(location.search);
            const incoming = params.get('add') || params.get('url') || params.get('text');
            if (incoming) {
                history.replaceState(null, '', location.pathname);
                addLinks(incoming, { title: params.get('title') || '' });
            }
        })();
    </script>
</body>

</html>
